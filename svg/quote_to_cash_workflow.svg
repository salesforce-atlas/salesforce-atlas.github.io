<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1B3B6F">
    Quote-to-Cash Workflow
  </text>
  
  <!-- Subtitle -->
  <text x="700" y="65" font-size="14" font-style="italic" text-anchor="middle" fill="#666">
    End-to-End Sales Process from Opportunity to Revenue
  </text>
  
  <!-- Main Flow -->
  <!-- Stage 1: Opportunity -->
  <rect x="50" y="120" width="220" height="160" fill="#E8F8E8" stroke="#2E844A" stroke-width="3" rx="10"/>
  <text x="160" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#2E844A">
    1. Opportunity
  </text>
  <line x1="60" y1="160" x2="260" y2="160" stroke="#2E844A" stroke-width="2"/>
  <text x="160" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Qualified Deal</text>
  <text x="70" y="210" font-size="11" fill="#4A4A4A">• Customer identified</text>
  <text x="70" y="227" font-size="11" fill="#4A4A4A">• Needs validated</text>
  <text x="70" y="244" font-size="11" fill="#4A4A4A">• Budget confirmed</text>
  <text x="70" y="261" font-size="11" fill="#4A4A4A">• Timeline established</text>
  
  <!-- Arrow 1 -->
  <path d="M 270 200 L 330 200" stroke="#1B3B6F" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="300" y="190" font-size="12" font-weight="bold" fill="#1B3B6F">Create</text>
  
  <!-- Stage 2: Quote -->
  <rect x="330" y="120" width="220" height="160" fill="#E6F3FF" stroke="#0176D3" stroke-width="3" rx="10"/>
  <text x="440" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#0176D3">
    2. Quote
  </text>
  <line x1="340" y1="160" x2="540" y2="160" stroke="#0176D3" stroke-width="2"/>
  <text x="440" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Pricing Proposal</text>
  <text x="350" y="210" font-size="11" fill="#4A4A4A">• Products added</text>
  <text x="350" y="227" font-size="11" fill="#4A4A4A">• Pricing calculated</text>
  <text x="350" y="244" font-size="11" fill="#4A4A4A">• Discounts applied</text>
  <text x="350" y="261" font-size="11" fill="#4A4A4A">• PDF generated</text>
  
  <!-- Arrow 2 -->
  <path d="M 550 200 L 610 200" stroke="#1B3B6F" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="580" y="190" font-size="12" font-weight="bold" fill="#1B3B6F">Accept</text>
  
  <!-- Stage 3: Contract -->
  <rect x="610" y="120" width="220" height="160" fill="#F0E6FF" stroke="#8B5CF6" stroke-width="3" rx="10"/>
  <text x="720" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#8B5CF6">
    3. Contract
  </text>
  <line x1="620" y1="160" x2="820" y2="160" stroke="#8B5CF6" stroke-width="2"/>
  <text x="720" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Legal Agreement</text>
  <text x="630" y="210" font-size="11" fill="#4A4A4A">• Terms defined</text>
  <text x="630" y="227" font-size="11" fill="#4A4A4A">• E-signature</text>
  <text x="630" y="244" font-size="11" fill="#4A4A4A">• Contract activated</text>
  <text x="630" y="261" font-size="11" fill="#4A4A4A">• Start/end dates</text>
  
  <!-- Arrow 3 -->
  <path d="M 830 200 L 890 200" stroke="#1B3B6F" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="860" y="190" font-size="12" font-weight="bold" fill="#1B3B6F">Convert</text>
  
  <!-- Stage 4: Order -->
  <rect x="890" y="120" width="220" height="160" fill="#FFF4E6" stroke="#FF9A3C" stroke-width="3" rx="10"/>
  <text x="1000" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#FF9A3C">
    4. Order
  </text>
  <line x1="900" y1="160" x2="1100" y2="160" stroke="#FF9A3C" stroke-width="2"/>
  <text x="1000" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Purchase Confirmed</text>
  <text x="910" y="210" font-size="11" fill="#4A4A4A">• Order created</text>
  <text x="910" y="227" font-size="11" fill="#4A4A4A">• Order activated</text>
  <text x="910" y="244" font-size="11" fill="#4A4A4A">• Billing triggered</text>
  <text x="910" y="261" font-size="11" fill="#4A4A4A">• Fulfillment starts</text>
  
  <!-- Arrow 4 -->
  <path d="M 1110 200 L 1170 200" stroke="#1B3B6F" stroke-width="4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="1140" y="190" font-size="12" font-weight="bold" fill="#1B3B6F">Process</text>
  
  <!-- Stage 5: Fulfillment -->
  <rect x="1170" y="120" width="180" height="160" fill="#FFE6F0" stroke="#DC2626" stroke-width="3" rx="10"/>
  <text x="1260" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#DC2626">
    5. Revenue
  </text>
  <line x1="1180" y1="160" x2="1340" y2="160" stroke="#DC2626" stroke-width="2"/>
  <text x="1260" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Cash Received</text>
  <text x="1185" y="210" font-size="11" fill="#4A4A4A">• Delivery</text>
  <text x="1185" y="227" font-size="11" fill="#4A4A4A">• Implementation</text>
  <text x="1185" y="244" font-size="11" fill="#4A4A4A">• Invoice paid</text>
  <text x="1185" y="261" font-size="11" fill="#4A4A4A">• Revenue recognized</text>
  
  <!-- Supporting Activities Section -->
  <rect x="50" y="320" width="650" height="280" fill="#F5F5F5" stroke="#666" stroke-width="2" rx="10"/>
  <text x="375" y="355" font-size="20" font-weight="bold" text-anchor="middle" fill="#1B3B6F">
    Supporting Activities
  </text>
  
  <!-- Approval Process -->
  <rect x="80" y="380" width="280" height="200" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" rx="8"/>
  <text x="220" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#8B5CF6">Approval Workflow</text>
  <line x1="90" y1="420" x2="350" y2="420" stroke="#8B5CF6" stroke-width="1"/>
  
  <text x="100" y="445" font-size="13" font-weight="bold" fill="#1B3B6F">Quote Approval Levels:</text>
  <text x="100" y="465" font-size="11" fill="#4A4A4A">• 0-10% discount → Auto-approve</text>
  <text x="100" y="482" font-size="11" fill="#4A4A4A">• 10-20% discount → Manager</text>
  <text x="100" y="499" font-size="11" fill="#4A4A4A">• 20-30% discount → Director</text>
  <text x="100" y="516" font-size="11" fill="#4A4A4A">• 30%+ discount → VP approval</text>
  
  <text x="100" y="541" font-size="13" font-weight="bold" fill="#1B3B6F">Contract Approval:</text>
  <text x="100" y="561" font-size="11" fill="#4A4A4A">• Legal review for terms</text>
  <text x="100" y="575" font-size="11" fill="#4A4A4A">• Finance review for payment</text>
  
  <!-- Integration Points -->
  <rect x="390" y="380" width="280" height="200" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="530" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#0176D3">Integration Points</text>
  <line x1="400" y1="420" x2="660" y2="420" stroke="#0176D3" stroke-width="1"/>
  
  <text x="410" y="445" font-size="13" font-weight="bold" fill="#1B3B6F">External Systems:</text>
  <text x="410" y="465" font-size="11" fill="#4A4A4A">• ERP: Order to invoice sync</text>
  <text x="410" y="482" font-size="11" fill="#4A4A4A">• CPQ: Complex pricing rules</text>
  <text x="410" y="499" font-size="11" fill="#4A4A4A">• DocuSign: E-signature</text>
  <text x="410" y="516" font-size="11" fill="#4A4A4A">• Billing: Revenue recognition</text>
  
  <text x="410" y="541" font-size="13" font-weight="bold" fill="#1B3B6F">Data Sync:</text>
  <text x="410" y="561" font-size="11" fill="#4A4A4A">• Bidirectional updates</text>
  <text x="410" y="575" font-size="11" fill="#4A4A4A">• Real-time or scheduled</text>
  
  <!-- CPQ Section -->
  <rect x="730" y="320" width="620" height="280" fill="#FFF4E6" stroke="#FF9A3C" stroke-width="3" rx="10"/>
  <text x="1040" y="355" font-size="20" font-weight="bold" text-anchor="middle" fill="#FF9A3C">
    Salesforce CPQ (Advanced)
  </text>
  
  <rect x="760" y="380" width="280" height="200" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="8"/>
  <text x="900" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Product Configuration</text>
  <line x1="770" y1="420" x2="1030" y2="420" stroke="#FF9A3C" stroke-width="1"/>
  
  <text x="780" y="445" font-size="13" font-weight="bold" fill="#1B3B6F">Guided Selling:</text>
  <text x="780" y="465" font-size="11" fill="#4A4A4A">• Product bundles</text>
  <text x="780" y="482" font-size="11" fill="#4A4A4A">• Option constraints</text>
  <text x="780" y="499" font-size="11" fill="#4A4A4A">• Required accessories</text>
  <text x="780" y="516" font-size="11" fill="#4A4A4A">• Configuration rules</text>
  
  <text x="780" y="541" font-size="13" font-weight="bold" fill="#1B3B6F">Pricing Engine:</text>
  <text x="780" y="561" font-size="11" fill="#4A4A4A">• Volume discounts</text>
  <text x="780" y="575" font-size="11" fill="#4A4A4A">• Partner pricing</text>
  
  <rect x="1070" y="380" width="250" height="200" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="8"/>
  <text x="1195" y="410" font-size="16" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Subscriptions</text>
  <line x1="1080" y1="420" x2="1310" y2="420" stroke="#FF9A3C" stroke-width="1"/>
  
  <text x="1090" y="445" font-size="13" font-weight="bold" fill="#1B3B6F">Recurring Revenue:</text>
  <text x="1090" y="465" font-size="11" fill="#4A4A4A">• Monthly/annual billing</text>
  <text x="1090" y="482" font-size="11" fill="#4A4A4A">• Proration logic</text>
  <text x="1090" y="499" font-size="11" fill="#4A4A4A">• Renewal management</text>
  
  <text x="1090" y="524" font-size="13" font-weight="bold" fill="#1B3B6F">Amendment:</text>
  <text x="1090" y="544" font-size="11" fill="#4A4A4A">• Add/remove products</text>
  <text x="1090" y="561" font-size="11" fill="#4A4A4A">• Quantity changes</text>
  <text x="1090" y="575" font-size="11" fill="#4A4A4A">• Mid-term upgrades</text>
  
  <!-- Best Practices Section -->
  <rect x="50" y="640" width="1300" height="270" fill="#E8F8E8" stroke="#2E844A" stroke-width="3" rx="10"/>
  <text x="700" y="675" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E844A">
    Quote-to-Cash Best Practices
  </text>
  
  <rect x="80" y="700" width="380" height="190" fill="#FFFFFF" stroke="#2E844A" stroke-width="2" rx="5"/>
  <text x="270" y="725" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Process Optimization</text>
  <line x1="90" y1="735" x2="450" y2="735" stroke="#2E844A" stroke-width="1"/>
  <text x="95" y="755" font-size="12" fill="#4A4A4A">✓ Standardize Quote Templates</text>
  <text x="105" y="773" font-size="10" fill="#666">Professional appearance builds trust</text>
  <text x="95" y="795" font-size="12" fill="#4A4A4A">✓ Automate Approval Routing</text>
  <text x="105" y="813" font-size="10" fill="#666">Reduce quote turnaround time</text>
  <text x="95" y="835" font-size="12" fill="#4A4A4A">✓ Track Conversion Metrics</text>
  <text x="105" y="853" font-size="10" fill="#666">Monitor quote acceptance rates</text>
  <text x="95" y="875" font-size="12" fill="#4A4A4A">✓ Enable E-Signature</text>
  <text x="105" y="893" font-size="10" fill="#666">Faster contract execution</text>
  
  <rect x="490" y="700" width="400" height="190" fill="#FFFFFF" stroke="#2E844A" stroke-width="2" rx="5"/>
  <text x="690" y="725" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Data Accuracy</text>
  <line x1="500" y1="735" x2="880" y2="735" stroke="#2E844A" stroke-width="1"/>
  <text x="505" y="755" font-size="12" fill="#4A4A4A">✓ Maintain Product Catalog</text>
  <text x="515" y="773" font-size="10" fill="#666">Keep pricing current and consistent</text>
  <text x="505" y="795" font-size="12" fill="#4A4A4A">✓ Sync Quote to Opportunity</text>
  <text x="515" y="813" font-size="10" fill="#666">Ensure forecast accuracy</text>
  <text x="505" y="835" font-size="12" fill="#4A4A4A">✓ Link Orders to Contracts</text>
  <text x="515" y="853" font-size="10" fill="#666">Track contract fulfillment status</text>
  <text x="505" y="875" font-size="12" fill="#4A4A4A">✓ Validate Integration Data</text>
  <text x="515" y="893" font-size="10" fill="#666">ERP sync must be bidirectional and accurate</text>
  
  <rect x="920" y="700" width="400" height="190" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="5"/>
  <text x="1120" y="725" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Revenue Operations</text>
  <line x1="930" y1="735" x2="1310" y2="735" stroke="#0176D3" stroke-width="1"/>
  <text x="935" y="755" font-size="12" fill="#4A4A4A">✓ Define Clear Handoffs</text>
  <text x="945" y="773" font-size="10" fill="#666">Sales → Operations → Finance transitions</text>
  <text x="935" y="795" font-size="12" fill="#4A4A4A">✓ Monitor Revenue Recognition</text>
  <text x="945" y="813" font-size="10" fill="#666">Compliance with accounting standards</text>
  <text x="935" y="835" font-size="12" fill="#4A4A4A">✓ Track Order Fulfillment</text>
  <text x="945" y="853" font-size="10" fill="#666">Visibility into delivery status</text>
  <text x="935" y="875" font-size="12" fill="#4A4A4A">✓ Report on Sales Cycle Time</text>
  <text x="945" y="893" font-size="10" fill="#666">Measure time from quote to cash</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#1B3B6F"/>
    </marker>
  </defs>
</svg>
