<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#003366">
    CPQ Data Model - Object Relationships
  </text>
  
  <!-- Legend -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="15" height="15" fill="#4A90E2" stroke="#003366"/>
    <text x="20" y="12" font-size="12" fill="#333">Quote Objects</text>
    
    <rect x="120" y="0" width="15" height="15" fill="#7CB342" stroke="#003366"/>
    <text x="140" y="12" font-size="12" fill="#333">Product Objects</text>
    
    <rect x="260" y="0" width="15" height="15" fill="#F4B400" stroke="#003366"/>
    <text x="280" y="12" font-size="12" fill="#333">Pricing Objects</text>
    
    <rect x="400" y="0" width="15" height="15" fill="#E57373" stroke="#003366"/>
    <text x="420" y="12" font-size="12" fill="#333">Contract Objects</text>
  </g>
  
  <!-- Quote Objects -->
  <g id="quote-section">
    <!-- Quote -->
    <rect x="50" y="120" width="180" height="100" rx="8" fill="#4A90E2" stroke="#003366" stroke-width="2"/>
    <text x="140" y="145" font-size="16" font-weight="bold" fill="white" text-anchor="middle">SBQQ__Quote__c</text>
    <text x="140" y="165" font-size="11" fill="white" text-anchor="middle">Master Quote Record</text>
    <text x="60" y="185" font-size="10" fill="white">• Account</text>
    <text x="60" y="200" font-size="10" fill="white">• Opportunity</text>
    <text x="60" y="215" font-size="10" fill="white">• Net Amount</text>
    
    <!-- Quote Line -->
    <rect x="50" y="260" width="180" height="100" rx="8" fill="#4A90E2" stroke="#003366" stroke-width="2"/>
    <text x="140" y="285" font-size="16" font-weight="bold" fill="white" text-anchor="middle">SBQQ__QuoteLine__c</text>
    <text x="140" y="305" font-size="11" fill="white" text-anchor="middle">Individual Line Items</text>
    <text x="60" y="325" font-size="10" fill="white">• Product</text>
    <text x="60" y="340" font-size="10" fill="white">• Quantity</text>
    <text x="60" y="355" font-size="10" fill="white">• Net Price</text>
    
    <!-- Quote Line Group -->
    <rect x="50" y="400" width="180" height="80" rx="8" fill="#4A90E2" stroke="#003366" stroke-width="2"/>
    <text x="140" y="425" font-size="14" font-weight="bold" fill="white" text-anchor="middle">QuoteLineGroup__c</text>
    <text x="140" y="442" font-size="10" fill="white" text-anchor="middle">Line Item Grouping</text>
    <text x="60" y="465" font-size="10" fill="white">• Name</text>
  </g>
  
  <!-- Product Objects -->
  <g id="product-section">
    <!-- Product2 -->
    <rect x="320" y="180" width="180" height="100" rx="8" fill="#7CB342" stroke="#003366" stroke-width="2"/>
    <text x="410" y="205" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Product2</text>
    <text x="410" y="225" font-size="11" fill="white" text-anchor="middle">Standard Product</text>
    <text x="330" y="245" font-size="10" fill="white">• Name</text>
    <text x="330" y="260" font-size="10" fill="white">• Product Code</text>
    <text x="330" y="275" font-size="10" fill="white">• Family</text>
    
    <!-- Product Option -->
    <rect x="320" y="320" width="180" height="100" rx="8" fill="#7CB342" stroke="#003366" stroke-width="2"/>
    <text x="410" y="345" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ProductOption__c</text>
    <text x="410" y="362" font-size="10" fill="white" text-anchor="middle">Bundle Components</text>
    <text x="330" y="382" font-size="10" fill="white">• Configured SKU</text>
    <text x="330" y="397" font-size="10" fill="white">• Optional SKU</text>
    <text x="330" y="412" font-size="10" fill="white">• Required</text>
    
    <!-- Product Feature -->
    <rect x="320" y="460" width="180" height="80" rx="8" fill="#7CB342" stroke="#003366" stroke-width="2"/>
    <text x="410" y="485" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ProductFeature__c</text>
    <text x="410" y="502" font-size="10" fill="white" text-anchor="middle">Feature Groups</text>
    <text x="330" y="525" font-size="10" fill="white">• Min/Max Options</text>
  </g>
  
  <!-- Pricing Objects -->
  <g id="pricing-section">
    <!-- Price Rule -->
    <rect x="590" y="120" width="180" height="100" rx="8" fill="#F4B400" stroke="#003366" stroke-width="2"/>
    <text x="680" y="145" font-size="16" font-weight="bold" fill="white" text-anchor="middle">PriceRule__c</text>
    <text x="680" y="165" font-size="11" fill="white" text-anchor="middle">Automated Pricing</text>
    <text x="600" y="185" font-size="10" fill="white">• Active</text>
    <text x="600" y="200" font-size="10" fill="white">• Evaluation Order</text>
    <text x="600" y="215" font-size="10" fill="white">• Conditions</text>
    
    <!-- Price Condition -->
    <rect x="830" y="120" width="180" height="80" rx="8" fill="#F4B400" stroke="#003366" stroke-width="2"/>
    <text x="920" y="145" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PriceCondition__c</text>
    <text x="920" y="162" font-size="10" fill="white" text-anchor="middle">Rule Triggers</text>
    <text x="840" y="182" font-size="10" fill="white">• Field/Operator/Value</text>
    
    <!-- Price Action -->
    <rect x="830" y="230" width="180" height="80" rx="8" fill="#F4B400" stroke="#003366" stroke-width="2"/>
    <text x="920" y="255" font-size="14" font-weight="bold" fill="white" text-anchor="middle">PriceAction__c</text>
    <text x="920" y="272" font-size="10" fill="white" text-anchor="middle">Rule Actions</text>
    <text x="840" y="292" font-size="10" fill="white">• Formula/Field Update</text>
    
    <!-- Discount Schedule -->
    <rect x="590" y="260" width="180" height="100" rx="8" fill="#F4B400" stroke="#003366" stroke-width="2"/>
    <text x="680" y="285" font-size="14" font-weight="bold" fill="white" text-anchor="middle">DiscountSchedule__c</text>
    <text x="680" y="302" font-size="10" fill="white" text-anchor="middle">Volume Discounts</text>
    <text x="600" y="322" font-size="10" fill="white">• Type (Range/Slab)</text>
    <text x="600" y="337" font-size="10" fill="white">• Discount Tiers</text>
    <text x="600" y="352" font-size="10" fill="white">• Discount Unit</text>
  </g>
  
  <!-- Contract Objects -->
  <g id="contract-section">
    <!-- Contract -->
    <rect x="590" y="400" width="180" height="100" rx="8" fill="#E57373" stroke="#003366" stroke-width="2"/>
    <text x="680" y="425" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Contract</text>
    <text x="680" y="445" font-size="11" fill="white" text-anchor="middle">Active Agreement</text>
    <text x="600" y="465" font-size="10" fill="white">• Account</text>
    <text x="600" y="480" font-size="10" fill="white">• Start/End Date</text>
    <text x="600" y="495" font-size="10" fill="white">• Status</text>
    
    <!-- Subscription -->
    <rect x="830" y="400" width="180" height="100" rx="8" fill="#E57373" stroke="#003366" stroke-width="2"/>
    <text x="920" y="425" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Subscription__c</text>
    <text x="920" y="442" font-size="10" fill="white" text-anchor="middle">Recurring Products</text>
    <text x="840" y="462" font-size="10" fill="white">• Quote Line</text>
    <text x="840" y="477" font-size="10" fill="white">• Term Start/End</text>
    <text x="840" y="492" font-size="10" fill="white">• Quantity</text>
  </g>
  
  <!-- Opportunity -->
  <rect x="50" y="550" width="180" height="90" rx="8" fill="#9575CD" stroke="#003366" stroke-width="2"/>
  <text x="140" y="575" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Opportunity</text>
  <text x="140" y="595" font-size="11" fill="white" text-anchor="middle">Sales Deal</text>
  <text x="60" y="615" font-size="10" fill="white">• Amount</text>
  <text x="60" y="630" font-size="10" fill="white">• Stage</text>
  
  <!-- Relationships (arrows) -->
  <!-- Quote to Quote Line (Master-Detail) -->
  <path d="M 140 220 L 140 260" stroke="#003366" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="150" y="245" font-size="11" fill="#003366" font-weight="bold">1:N</text>
  
  <!-- Quote to Opportunity (Lookup) -->
  <path d="M 140 530 Q 140 540, 140 550" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="150" y="540" font-size="11" fill="#666">Lookup</text>
  
  <!-- Quote Line to Product (Lookup) -->
  <path d="M 230 310 L 320 230" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="260" y="265" font-size="11" fill="#666">Lookup</text>
  
  <!-- Quote Line to Quote Line Group -->
  <path d="M 140 360 L 140 400" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="150" y="385" font-size="11" fill="#666">Optional</text>
  
  <!-- Product to Product Option -->
  <path d="M 410 280 L 410 320" stroke="#003366" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="420" y="305" font-size="11" fill="#003366">Parent</text>
  
  <!-- Product Option to Product Feature -->
  <path d="M 410 420 L 410 460" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  
  <!-- Quote Line to Price Rule (applies) -->
  <path d="M 230 290 Q 400 200, 590 170" stroke="#F4B400" stroke-width="2" fill="none" stroke-dasharray="3,3"/>
  <text x="390" y="230" font-size="11" fill="#F4B400">Applies</text>
  
  <!-- Price Rule to Conditions/Actions -->
  <path d="M 770 160 L 830 160" stroke="#003366" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 770 190 Q 800 230, 830 260" stroke="#003366" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Product to Discount Schedule -->
  <path d="M 500 240 Q 545 265, 590 300" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead-dashed)"/>
  <text x="530" y="280" font-size="11" fill="#666">Optional</text>
  
  <!-- Quote to Contract -->
  <path d="M 230 150 Q 410 280, 590 450" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="380" y="300" font-size="11" fill="#666">Creates</text>
  
  <!-- Quote Line to Subscription -->
  <path d="M 230 320 Q 530 380, 830 450" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="520" y="360" font-size="11" fill="#666">Generates</text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#003366"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Footer Notes -->
  <text x="600" y="750" font-size="12" text-anchor="middle" fill="#666">
    Solid lines: Master-Detail | Dashed lines: Lookup | Dotted lines: Process Flow
  </text>
  <text x="600" y="770" font-size="12" text-anchor="middle" fill="#666">
    1:N indicates One-to-Many relationship
  </text>
</svg>
