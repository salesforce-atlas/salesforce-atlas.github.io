<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950">
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Data Integration Strategies
  </text>
  
  <!-- Batch Integration -->
  <g>
    <rect x="50" y="100" width="420" height="380" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="3" rx="12"/>
    <text x="260" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#0284C7">
      Batch Integration
    </text>
    <text x="260" y="165" font-size="13" text-anchor="middle" fill="#4B5563" font-style="italic">
      Process data in scheduled batches
    </text>
    
    <!-- Batch Flow Diagram -->
    <rect x="80" y="190" width="100" height="60" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="5"/>
    <text x="130" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Source</text>
    <text x="130" y="232" font-size="10" text-anchor="middle" fill="white">System</text>
    
    <rect x="220" y="190" width="100" height="60" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2" rx="5"/>
    <text x="270" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Extract &amp;</text>
    <text x="270" y="232" font-size="10" text-anchor="middle" fill="white">Transform</text>
    
    <rect x="360" y="190" width="90" height="60" fill="#10B981" stroke="#059669" stroke-width="2" rx="5"/>
    <text x="405" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Load to</text>
    <text x="405" y="232" font-size="10" text-anchor="middle" fill="white">Salesforce</text>
    
    <!-- Arrows -->
    <defs>
      <marker id="batch-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
      </marker>
    </defs>
    <path d="M 180 220 L 220 220" stroke="#6B7280" stroke-width="3" marker-end="url(#batch-arrow)"/>
    <path d="M 320 220 L 360 220" stroke="#6B7280" stroke-width="3" marker-end="url(#batch-arrow)"/>
    
    <!-- Scheduling -->
    <rect x="80" y="270" width="370" height="40" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" rx="5"/>
    <text x="265" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E40AF">
      ⏰ Scheduled: Nightly, Hourly, Weekly
    </text>
    
    <!-- Characteristics -->
    <text x="80" y="335" font-size="14" font-weight="bold" fill="#1F2937">Characteristics:</text>
    <text x="90" y="355" font-size="11" fill="#4B5563">✓ Scheduled processing</text>
    <text x="90" y="372" font-size="11" fill="#4B5563">✓ High volume (millions of records)</text>
    <text x="90" y="389" font-size="11" fill="#4B5563">✓ Off-peak processing</text>
    <text x="90" y="406" font-size="11" fill="#4B5563">✓ Bulk API usage</text>
    <text x="90" y="423" font-size="11" fill="#4B5563">✓ Transactional consistency</text>
    
    <!-- Best For -->
    <text x="270" y="335" font-size="14" font-weight="bold" fill="#1F2937">Best For:</text>
    <text x="280" y="355" font-size="11" fill="#4B5563">• Daily data warehouse sync</text>
    <text x="280" y="372" font-size="11" fill="#4B5563">• Nightly customer updates</text>
    <text x="280" y="389" font-size="11" fill="#4B5563">• Monthly reconciliation</text>
    <text x="280" y="406" font-size="11" fill="#4B5563">• Historical data migration</text>
    <text x="280" y="423" font-size="11" fill="#4B5563">• Report generation</text>
    
    <!-- Performance -->
    <rect x="80" y="440" width="370" height="30" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="265" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">
      Performance: 5,000-10,000 records/batch
    </text>
  </g>
  
  <!-- Real-Time Integration -->
  <g>
    <rect x="490" y="100" width="420" height="380" fill="#FEF2F2" stroke="#EF4444" stroke-width="3" rx="12"/>
    <text x="700" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#DC2626">
      Real-Time Integration
    </text>
    <text x="700" y="165" font-size="13" text-anchor="middle" fill="#4B5563" font-style="italic">
      Immediate data synchronization
    </text>
    
    <!-- Real-Time Flow -->
    <rect x="520" y="190" width="90" height="60" fill="#EF4444" stroke="#DC2626" stroke-width="2" rx="5"/>
    <text x="565" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Event</text>
    <text x="565" y="232" font-size="10" text-anchor="middle" fill="white">Occurs</text>
    
    <circle cx="670" cy="220" r="30" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <text x="670" y="227" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Trigger</text>
    
    <rect x="730" y="190" width="90" height="60" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2" rx="5"/>
    <text x="775" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Process</text>
    <text x="775" y="232" font-size="10" text-anchor="middle" fill="white">Data</text>
    
    <circle cx="870" cy="220" r="30" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="870" y="227" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Update</text>
    
    <!-- Arrows -->
    <path d="M 610 220 L 640 220" stroke="#6B7280" stroke-width="3" marker-end="url(#batch-arrow)"/>
    <path d="M 700 220 L 730 220" stroke="#6B7280" stroke-width="3" marker-end="url(#batch-arrow)"/>
    <path d="M 820 220 L 840 220" stroke="#6B7280" stroke-width="3" marker-end="url(#batch-arrow)"/>
    
    <!-- Latency -->
    <rect x="520" y="270" width="360" height="40" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" rx="5"/>
    <text x="700" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E40AF">
      ⚡ Latency: Milliseconds to Seconds
    </text>
    
    <!-- Characteristics -->
    <text x="520" y="335" font-size="14" font-weight="bold" fill="#1F2937">Characteristics:</text>
    <text x="530" y="355" font-size="11" fill="#4B5563">✓ Immediate processing</text>
    <text x="530" y="372" font-size="11" fill="#4B5563">✓ Event-driven triggers</text>
    <text x="530" y="389" font-size="11" fill="#4B5563">✓ Low latency</text>
    <text x="530" y="406" font-size="11" fill="#4B5563">✓ Individual records</text>
    <text x="530" y="423" font-size="11" fill="#4B5563">✓ Always-on connections</text>
    
    <!-- Best For -->
    <text x="710" y="335" font-size="14" font-weight="bold" fill="#1F2937">Best For:</text>
    <text x="720" y="355" font-size="11" fill="#4B5563">• Order creation</text>
    <text x="720" y="372" font-size="11" fill="#4B5563">• Inventory updates</text>
    <text x="720" y="389" font-size="11" fill="#4B5563">• Customer service</text>
    <text x="720" y="406" font-size="11" fill="#4B5563">• Payment processing</text>
    <text x="720" y="423" font-size="11" fill="#4B5563">• Real-time dashboards</text>
    
    <!-- Performance -->
    <rect x="520" y="440" width="360" height="30" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="700" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">
      Performance: Sub-second response time
    </text>
  </g>
  
  <!-- Hybrid Integration -->
  <g>
    <rect x="930" y="100" width="420" height="380" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="3" rx="12"/>
    <text x="1140" y="140" font-size="24" font-weight="bold" text-anchor="middle" fill="#7C3AED">
      Hybrid Integration
    </text>
    <text x="1140" y="165" font-size="13" text-anchor="middle" fill="#4B5563" font-style="italic">
      Combine batch and real-time approaches
    </text>
    
    <!-- Hybrid Flow -->
    <rect x="960" y="190" width="160" height="50" fill="#EF4444" stroke="#DC2626" stroke-width="2" rx="5"/>
    <text x="1040" y="212" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Critical Data</text>
    <text x="1040" y="228" font-size="10" text-anchor="middle" fill="white">→ Real-Time</text>
    
    <rect x="1150" y="190" width="160" height="50" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" rx="5"/>
    <text x="1230" y="212" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Non-Critical Data</text>
    <text x="1230" y="228" font-size="10" text-anchor="middle" fill="white">→ Batch</text>
    
    <!-- Decision Logic -->
    <rect x="960" y="260" width="350" height="70" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="1135" y="283" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400E">
      Decision Criteria
    </text>
    <text x="975" y="302" font-size="10" fill="#78350F">• Business urgency</text>
    <text x="975" y="317" font-size="10" fill="#78350F">• Data volume</text>
    <text x="1135" y="302" font-size="10" fill="#78350F">• API limits</text>
    <text x="1135" y="317" font-size="10" fill="#78350F">• Cost considerations</text>
    
    <!-- Examples -->
    <text x="960" y="355" font-size="14" font-weight="bold" fill="#1F2937">Examples:</text>
    <text x="970" y="375" font-size="11" fill="#4B5563">Real-Time:</text>
    <text x="985" y="392" font-size="10" fill="#6B7280">• Order placement (immediate)</text>
    <text x="985" y="407" font-size="10" fill="#6B7280">• Critical inventory levels</text>
    <text x="985" y="422" font-size="10" fill="#6B7280">• Customer registration</text>
    
    <text x="1155" y="375" font-size="11" fill="#4B5563">Batch:</text>
    <text x="1170" y="392" font-size="10" fill="#6B7280">• Product catalog sync</text>
    <text x="1170" y="407" font-size="10" fill="#6B7280">• Historical analytics</text>
    <text x="1170" y="422" font-size="10" fill="#6B7280">• Monthly reconciliation</text>
    
    <!-- Performance -->
    <rect x="960" y="440" width="350" height="30" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="1135" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">
      Performance: Optimized per use case
    </text>
  </g>
  
  <!-- Decision Matrix -->
  <g>
    <rect x="50" y="520" width="1300" height="400" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2" rx="12"/>
    <text x="700" y="560" font-size="26" font-weight="bold" text-anchor="middle" fill="#1F2937">
      Strategy Decision Matrix
    </text>
    
    <!-- Table Header -->
    <rect x="80" y="590" width="240" height="50" fill="#1F2937" stroke="#111827" stroke-width="1" rx="5"/>
    <text x="200" y="620" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Scenario</text>
    
    <rect x="330" y="590" width="200" height="50" fill="#1F2937" stroke="#111827" stroke-width="1" rx="5"/>
    <text x="430" y="620" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Strategy</text>
    
    <rect x="540" y="590" width="450" height="50" fill="#1F2937" stroke="#111827" stroke-width="1" rx="5"/>
    <text x="765" y="620" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Reason</text>
    
    <rect x="1000" y="590" width="320" height="50" fill="#1F2937" stroke="#111827" stroke-width="1" rx="5"/>
    <text x="1160" y="620" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Implementation</text>
    
    <!-- Row 1 -->
    <rect x="80" y="640" width="240" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="200" y="675" font-size="11" text-anchor="middle" fill="#1F2937">Order placement</text>
    
    <rect x="330" y="640" width="200" height="60" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/>
    <text x="430" y="675" font-size="12" font-weight="bold" text-anchor="middle" fill="#DC2626">Real-Time</text>
    
    <rect x="540" y="640" width="450" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="765" y="668" font-size="10" text-anchor="middle" fill="#4B5563">Customer expects immediate</text>
    <text x="765" y="683" font-size="10" text-anchor="middle" fill="#4B5563">confirmation and processing</text>
    
    <rect x="1000" y="640" width="320" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1160" y="675" font-size="10" text-anchor="middle" fill="#4B5563">Platform Events / Webhooks</text>
    
    <!-- Row 2 -->
    <rect x="80" y="700" width="240" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="200" y="735" font-size="11" text-anchor="middle" fill="#1F2937">Product catalog sync</text>
    
    <rect x="330" y="700" width="200" height="60" fill="#DBEAFE" stroke="#E5E7EB" stroke-width="1"/>
    <text x="430" y="735" font-size="12" font-weight="bold" text-anchor="middle" fill="#0284C7">Batch</text>
    
    <rect x="540" y="700" width="450" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="765" y="728" font-size="10" text-anchor="middle" fill="#4B5563">Large dataset, not time-sensitive,</text>
    <text x="765" y="743" font-size="10" text-anchor="middle" fill="#4B5563">can be processed overnight</text>
    
    <rect x="1000" y="700" width="320" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1160" y="735" font-size="10" text-anchor="middle" fill="#4B5563">Bulk API / Scheduled Jobs</text>
    
    <!-- Row 3 -->
    <rect x="80" y="760" width="240" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="200" y="795" font-size="11" text-anchor="middle" fill="#1F2937">Critical inventory alert</text>
    
    <rect x="330" y="760" width="200" height="60" fill="#FEE2E2" stroke="#E5E7EB" stroke-width="1"/>
    <text x="430" y="795" font-size="12" font-weight="bold" text-anchor="middle" fill="#DC2626">Real-Time</text>
    
    <rect x="540" y="760" width="450" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="765" y="788" font-size="10" text-anchor="middle" fill="#4B5563">Prevent overselling, immediate</text>
    <text x="765" y="803" font-size="10" text-anchor="middle" fill="#4B5563">action required</text>
    
    <rect x="1000" y="760" width="320" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1160" y="795" font-size="10" text-anchor="middle" fill="#4B5563">Change Data Capture</text>
    
    <!-- Row 4 -->
    <rect x="80" y="820" width="240" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="200" y="855" font-size="11" text-anchor="middle" fill="#1F2937">Historical analytics</text>
    
    <rect x="330" y="820" width="200" height="60" fill="#DBEAFE" stroke="#E5E7EB" stroke-width="1"/>
    <text x="430" y="855" font-size="12" font-weight="bold" text-anchor="middle" fill="#0284C7">Batch</text>
    
    <rect x="540" y="820" width="450" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="765" y="848" font-size="10" text-anchor="middle" fill="#4B5563">Large volumes, processed</text>
    <text x="765" y="863" font-size="10" text-anchor="middle" fill="#4B5563">overnight for reporting</text>
    
    <rect x="1000" y="820" width="320" height="60" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <text x="1160" y="855" font-size="10" text-anchor="middle" fill="#4B5563">ETL Pipeline / Bulk API</text>
    
    <!-- Row 5 -->
    <rect x="80" y="880" width="240" height="60" fill="white" stroke="#E5E7EB" stroke-width="1" rx="0 0 5 5"/>
    <text x="200" y="915" font-size="11" text-anchor="middle" fill="#1F2937">E-commerce platform</text>
    
    <rect x="330" y="880" width="200" height="60" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1" rx="0 0 5 5"/>
    <text x="430" y="915" font-size="12" font-weight="bold" text-anchor="middle" fill="#7C3AED">Hybrid</text>
    
    <rect x="540" y="880" width="450" height="60" fill="white" stroke="#E5E7EB" stroke-width="1" rx="0 0 5 5"/>
    <text x="765" y="908" font-size="10" text-anchor="middle" fill="#4B5563">Orders real-time, catalog batch,</text>
    <text x="765" y="923" font-size="10" text-anchor="middle" fill="#4B5563">optimize based on priority</text>
    
    <rect x="1000" y="880" width="320" height="60" fill="white" stroke="#E5E7EB" stroke-width="1" rx="0 0 5 5"/>
    <text x="1160" y="908" font-size="10" text-anchor="middle" fill="#4B5563">Platform Events + Bulk API</text>
    <text x="1160" y="923" font-size="10" text-anchor="middle" fill="#4B5563">Combined approach</text>
  </g>
</svg>
