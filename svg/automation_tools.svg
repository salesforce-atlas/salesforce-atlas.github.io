<svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" text-anchor="middle" fill="#032e61">
    Salesforce Automation Tools Comparison
  </text>
  
  <!-- Column Headers -->
  <rect x="50" y="60" width="180" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="140" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Tool</text>
  
  <rect x="230" y="60" width="150" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="305" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Complexity</text>
  
  <rect x="380" y="60" width="150" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="455" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Status</text>
  
  <rect x="530" y="60" width="420" height="50" fill="#34495e" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="740" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Use Cases</text>
  
  <!-- Flow -->
  <rect x="50" y="110" width="180" height="100" fill="#2ecc71" opacity="0.2" stroke="#27ae60" stroke-width="2" rx="5"/>
  <text x="140" y="140" font-size="18" font-weight="bold" text-anchor="middle" fill="#27ae60">Flow Builder</text>
  <text x="140" y="165" font-size="13" text-anchor="middle" fill="#2c3e50">No-Code</text>
  <text x="140" y="185" font-size="13" text-anchor="middle" fill="#2c3e50">Visual Builder</text>
  
  <rect x="230" y="110" width="150" height="100" fill="#f39c12" opacity="0.2" stroke="#d68910" stroke-width="2"/>
  <text x="305" y="165" font-size="14" text-anchor="middle" fill="#2c3e50">Low to High</text>
  
  <rect x="380" y="110" width="150" height="100" fill="#27ae60" opacity="0.3" stroke="#1e8449" stroke-width="2"/>
  <text x="455" y="155" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e8449">✓ Current</text>
  <text x="455" y="175" font-size="12" text-anchor="middle" fill="#2c3e50">(Recommended)</text>
  
  <rect x="530" y="110" width="420" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="545" y="135" font-size="13" fill="#2c3e50">• Screen flows with user input</text>
  <text x="545" y="155" font-size="13" fill="#2c3e50">• Complex record automation</text>
  <text x="545" y="175" font-size="13" fill="#2c3e50">• Scheduled automation</text>
  <text x="545" y="195" font-size="13" fill="#2c3e50">• Platform event triggers</text>
  
  <!-- Process Builder -->
  <rect x="50" y="210" width="180" height="100" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="140" y="240" font-size="18" font-weight="bold" text-anchor="middle" fill="#2980b9">Process Builder</text>
  <text x="140" y="265" font-size="13" text-anchor="middle" fill="#2c3e50">No-Code</text>
  <text x="140" y="285" font-size="13" text-anchor="middle" fill="#2c3e50">Point-and-Click</text>
  
  <rect x="230" y="210" width="150" height="100" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="2"/>
  <text x="305" y="265" font-size="14" text-anchor="middle" fill="#2c3e50">Low to Medium</text>
  
  <rect x="380" y="210" width="150" height="100" fill="#e74c3c" opacity="0.3" stroke="#c0392b" stroke-width="2"/>
  <text x="455" y="255" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">⚠ Legacy</text>
  <text x="455" y="275" font-size="12" text-anchor="middle" fill="#2c3e50">(Being retired)</text>
  
  <rect x="530" y="210" width="420" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="545" y="235" font-size="13" fill="#2c3e50">• Record updates and creation</text>
  <text x="545" y="255" font-size="13" fill="#2c3e50">• Email alerts</text>
  <text x="545" y="275" font-size="13" fill="#2c3e50">• Field updates</text>
  <text x="545" y="295" font-size="13" font-style="italic" fill="#e74c3c">→ Migrate to Flow</text>
  
  <!-- Workflow Rules -->
  <rect x="50" y="310" width="180" height="100" fill="#95a5a6" opacity="0.2" stroke="#7f8c8d" stroke-width="2" rx="5"/>
  <text x="140" y="340" font-size="18" font-weight="bold" text-anchor="middle" fill="#7f8c8d">Workflow Rules</text>
  <text x="140" y="365" font-size="13" text-anchor="middle" fill="#2c3e50">No-Code</text>
  <text x="140" y="385" font-size="13" text-anchor="middle" fill="#2c3e50">Simple Logic</text>
  
  <rect x="230" y="310" width="150" height="100" fill="#95a5a6" opacity="0.2" stroke="#7f8c8d" stroke-width="2"/>
  <text x="305" y="365" font-size="14" text-anchor="middle" fill="#2c3e50">Low</text>
  
  <rect x="380" y="310" width="150" height="100" fill="#e74c3c" opacity="0.3" stroke="#c0392b" stroke-width="2"/>
  <text x="455" y="355" font-size="15" font-weight="bold" text-anchor="middle" fill="#c0392b">⚠ Legacy</text>
  <text x="455" y="375" font-size="12" text-anchor="middle" fill="#2c3e50">(Being retired)</text>
  
  <rect x="530" y="310" width="420" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="545" y="335" font-size="13" fill="#2c3e50">• Simple field updates</text>
  <text x="545" y="355" font-size="13" fill="#2c3e50">• Email alerts</text>
  <text x="545" y="375" font-size="13" fill="#2c3e50">• Task creation</text>
  <text x="545" y="395" font-size="13" font-style="italic" fill="#e74c3c">→ Migrate to Flow</text>
  
  <!-- Apex Triggers -->
  <rect x="50" y="410" width="180" height="100" fill="#9b59b6" opacity="0.2" stroke="#8e44ad" stroke-width="2" rx="5"/>
  <text x="140" y="440" font-size="18" font-weight="bold" text-anchor="middle" fill="#8e44ad">Apex Triggers</text>
  <text x="140" y="465" font-size="13" text-anchor="middle" fill="#2c3e50">Code-Based</text>
  <text x="140" y="485" font-size="13" text-anchor="middle" fill="#2c3e50">Java-like</text>
  
  <rect x="230" y="410" width="150" height="100" fill="#e74c3c" opacity="0.2" stroke="#c0392b" stroke-width="2"/>
  <text x="305" y="465" font-size="14" text-anchor="middle" fill="#2c3e50">High</text>
  
  <rect x="380" y="410" width="150" height="100" fill="#27ae60" opacity="0.3" stroke="#1e8449" stroke-width="2"/>
  <text x="455" y="455" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e8449">✓ Current</text>
  <text x="455" y="475" font-size="12" text-anchor="middle" fill="#2c3e50">(For complex logic)</text>
  
  <rect x="530" y="410" width="420" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="545" y="435" font-size="13" fill="#2c3e50">• Complex business logic</text>
  <text x="545" y="455" font-size="13" fill="#2c3e50">• External integrations (callouts)</text>
  <text x="545" y="475" font-size="13" fill="#2c3e50">• Performance-critical operations</text>
  <text x="545" y="495" font-size="13" fill="#2c3e50">• Advanced error handling</text>
  
  <!-- Approval Processes -->
  <rect x="50" y="510" width="180" height="100" fill="#e67e22" opacity="0.2" stroke="#d35400" stroke-width="2" rx="5"/>
  <text x="140" y="540" font-size="18" font-weight="bold" text-anchor="middle" fill="#d35400">Approval</text>
  <text x="140" y="560" font-size="18" font-weight="bold" text-anchor="middle" fill="#d35400">Processes</text>
  <text x="140" y="585" font-size="13" text-anchor="middle" fill="#2c3e50">No-Code</text>
  
  <rect x="230" y="510" width="150" height="100" fill="#f39c12" opacity="0.2" stroke="#d68910" stroke-width="2"/>
  <text x="305" y="565" font-size="14" text-anchor="middle" fill="#2c3e50">Medium</text>
  
  <rect x="380" y="510" width="150" height="100" fill="#27ae60" opacity="0.3" stroke="#1e8449" stroke-width="2"/>
  <text x="455" y="555" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e8449">✓ Current</text>
  <text x="455" y="575" font-size="12" text-anchor="middle" fill="#2c3e50">(Specialized)</text>
  
  <rect x="530" y="510" width="420" height="100" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="545" y="535" font-size="13" fill="#2c3e50">• Multi-step approvals</text>
  <text x="545" y="555" font-size="13" fill="#2c3e50">• Manager approval workflows</text>
  <text x="545" y="575" font-size="13" fill="#2c3e50">• Expense approvals</text>
  <text x="545" y="595" font-size="13" fill="#2c3e50">• Discount approvals</text>
  
  <!-- Recommendation Box -->
  <rect x="50" y="625" width="900" height="20" fill="#3498db" opacity="0.2" stroke="#2980b9" stroke-width="2" rx="5"/>
  <text x="500" y="640" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    💡 Recommendation: Use Flow for new automation (migrate from Process Builder &amp; Workflow), Apex for complex logic
  </text>
</svg>