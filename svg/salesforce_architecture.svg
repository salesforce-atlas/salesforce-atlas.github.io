<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#032e61">
    Salesforce Multi-Tenant Architecture
  </text>
  
  <!-- User Interface Layer -->
  <rect x="100" y="80" width="600" height="120" fill="#00a1e0" opacity="0.2" stroke="#00a1e0" stroke-width="2" rx="10"/>
  <text x="400" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#032e61">
    User Interface Layer
  </text>
  <text x="150" y="145" font-size="16" fill="#032e61">• Lightning Experience</text>
  <text x="400" y="145" font-size="16" fill="#032e61">• Salesforce Mobile</text>
  <text x="150" y="175" font-size="16" fill="#032e61">• APIs (REST/SOAP)</text>
  <text x="400" y="175" font-size="16" fill="#032e61">• Custom UI</text>
  
  <!-- Arrow down -->
  <path d="M 400 210 L 400 240" stroke="#032e61" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Business Logic Layer -->
  <rect x="100" y="250" width="600" height="120" fill="#f39c12" opacity="0.2" stroke="#f39c12" stroke-width="2" rx="10"/>
  <text x="400" y="280" font-size="20" font-weight="bold" text-anchor="middle" fill="#032e61">
    Business Logic Layer
  </text>
  <text x="150" y="315" font-size="16" fill="#032e61">• Apex Code</text>
  <text x="400" y="315" font-size="16" fill="#032e61">• Flow Builder</text>
  <text x="150" y="345" font-size="16" fill="#032e61">• Validation Rules</text>
  <text x="400" y="345" font-size="16" fill="#032e61">• Workflow Rules</text>
  
  <!-- Arrow down -->
  <path d="M 400 380 L 400 410" stroke="#032e61" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Data Model Layer -->
  <rect x="100" y="420" width="600" height="120" fill="#27ae60" opacity="0.2" stroke="#27ae60" stroke-width="2" rx="10"/>
  <text x="400" y="450" font-size="20" font-weight="bold" text-anchor="middle" fill="#032e61">
    Data Model Layer
  </text>
  <text x="150" y="485" font-size="16" fill="#032e61">• Standard Objects</text>
  <text x="400" y="485" font-size="16" fill="#032e61">• Custom Objects</text>
  <text x="150" y="515" font-size="16" fill="#032e61">• Relationships</text>
  <text x="400" y="515" font-size="16" fill="#032e61">• Fields &amp; Metadata</text>
  
  <!-- Multi-tenant note -->
  <rect x="50" y="560" width="700" height="30" fill="#e74c3c" opacity="0.1" stroke="#e74c3c" stroke-width="2" rx="5"/>
  <text x="400" y="580" font-size="14" font-weight="bold" text-anchor="middle" fill="#e74c3c">
    Multi-Tenant: Shared Infrastructure | Isolated Data | Automatic Updates
  </text>
  
  <!-- Arrow definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#032e61"/>
    </marker>
  </defs>
</svg>