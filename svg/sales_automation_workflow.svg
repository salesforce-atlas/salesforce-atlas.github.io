<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="700" y="35" font-size="26" font-weight="bold" text-anchor="middle" fill="#1B3B6F">
    Sales Cloud Automation Workflow
  </text>
  
  <!-- Subtitle -->
  <text x="700" y="65" font-size="14" font-style="italic" text-anchor="middle" fill="#666">
    Streamline sales processes with declarative and AI-powered automation
  </text>
  
  <!-- Top Row: Automation Tools -->
  <rect x="50" y="100" width="1300" height="200" fill="#E6F3FF" stroke="#0176D3" stroke-width="3" rx="10"/>
  <text x="700" y="130" font-size="20" font-weight="bold" text-anchor="middle" fill="#0176D3">
    Automation Tools
  </text>
  
  <!-- Workflow Rules -->
  <rect x="80" y="150" width="230" height="130" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="195" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Workflow Rules</text>
  <text x="195" y="195" font-size="11" text-anchor="middle" fill="#666">(Classic Automation)</text>
  <line x1="90" y1="205" x2="300" y2="205" stroke="#0176D3" stroke-width="1"/>
  <text x="90" y="225" font-size="11" fill="#4A4A4A">• IF-THEN logic</text>
  <text x="90" y="242" font-size="11" fill="#4A4A4A">• Field updates</text>
  <text x="90" y="259" font-size="11" fill="#4A4A4A">• Email alerts</text>
  <text x="90" y="276" font-size="11" fill="#4A4A4A">• Task creation</text>
  
  <!-- Process Builder -->
  <rect x="340" y="150" width="230" height="130" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="455" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Process Builder</text>
  <text x="455" y="195" font-size="11" text-anchor="middle" fill="#666">(Visual Workflow)</text>
  <line x1="350" y1="205" x2="560" y2="205" stroke="#0176D3" stroke-width="1"/>
  <text x="350" y="225" font-size="11" fill="#4A4A4A">• Point-and-click</text>
  <text x="350" y="242" font-size="11" fill="#4A4A4A">• Multiple actions</text>
  <text x="350" y="259" font-size="11" fill="#4A4A4A">• Schedule actions</text>
  <text x="350" y="276" font-size="11" fill="#4A4A4A">• Invoke Apex/Flow</text>
  
  <!-- Flow Builder -->
  <rect x="600" y="150" width="230" height="130" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="715" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Flow Builder</text>
  <text x="715" y="195" font-size="11" text-anchor="middle" fill="#666">(Modern Automation)</text>
  <line x1="610" y1="205" x2="820" y2="205" stroke="#0176D3" stroke-width="1"/>
  <text x="610" y="225" font-size="11" fill="#4A4A4A">• Screen flows</text>
  <text x="610" y="242" font-size="11" fill="#4A4A4A">• Loops &amp; decisions</text>
  <text x="610" y="259" font-size="11" fill="#4A4A4A">• Record triggers</text>
  <text x="610" y="276" font-size="11" fill="#4A4A4A">• Complex logic</text>
  
  <!-- Approval Processes -->
  <rect x="860" y="150" width="230" height="130" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="975" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Approval Process</text>
  <text x="975" y="195" font-size="11" text-anchor="middle" fill="#666">(Multi-Step Routing)</text>
  <line x1="870" y1="205" x2="1080" y2="205" stroke="#0176D3" stroke-width="1"/>
  <text x="870" y="225" font-size="11" fill="#4A4A4A">• Manager approval</text>
  <text x="870" y="242" font-size="11" fill="#4A4A4A">• Multi-level</text>
  <text x="870" y="259" font-size="11" fill="#4A4A4A">• Delegation</text>
  <text x="870" y="276" font-size="11" fill="#4A4A4A">• Email notifications</text>
  
  <!-- Einstein AI -->
  <rect x="1120" y="150" width="200" height="130" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="8"/>
  <text x="1220" y="175" font-size="15" font-weight="bold" text-anchor="middle" fill="#FF9A3C">Einstein AI</text>
  <text x="1220" y="195" font-size="11" text-anchor="middle" fill="#666">(AI Automation)</text>
  <line x1="1130" y1="205" x2="1310" y2="205" stroke="#FF9A3C" stroke-width="1"/>
  <text x="1130" y="225" font-size="11" fill="#4A4A4A">• Lead scoring</text>
  <text x="1130" y="242" font-size="11" fill="#4A4A4A">• Opp scoring</text>
  <text x="1130" y="259" font-size="11" fill="#4A4A4A">• Predictions</text>
  <text x="1130" y="276" font-size="11" fill="#4A4A4A">• Insights</text>
  
  <!-- Middle Section: Automation Use Cases -->
  <rect x="50" y="330" width="640" height="300" fill="#FFF4E6" stroke="#FF9A3C" stroke-width="3" rx="10"/>
  <text x="370" y="365" font-size="20" font-weight="bold" text-anchor="middle" fill="#FF9A3C">
    Common Automation Use Cases
  </text>
  
  <!-- Use Case 1 -->
  <rect x="80" y="390" width="280" height="110" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="5"/>
  <text x="220" y="412" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Lead Assignment</text>
  <line x1="90" y1="422" x2="350" y2="422" stroke="#FF9A3C" stroke-width="1"/>
  <text x="95" y="440" font-size="11" fill="#4A4A4A">Trigger: New Lead Created</text>
  <text x="95" y="457" font-size="11" fill="#4A4A4A">Action: Assign to sales rep by territory</text>
  <text x="95" y="474" font-size="11" fill="#4A4A4A">Action: Send email notification to rep</text>
  <text x="95" y="491" font-size="11" fill="#4A4A4A">Action: Create follow-up task</text>
  
  <!-- Use Case 2 -->
  <rect x="390" y="390" width="280" height="110" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="5"/>
  <text x="530" y="412" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Opportunity Stage Change</text>
  <line x1="400" y1="422" x2="660" y2="422" stroke="#FF9A3C" stroke-width="1"/>
  <text x="405" y="440" font-size="11" fill="#4A4A4A">Trigger: Stage updated to "Closed Won"</text>
  <text x="405" y="457" font-size="11" fill="#4A4A4A">Action: Update account status</text>
  <text x="405" y="474" font-size="11" fill="#4A4A4A">Action: Notify sales ops team</text>
  <text x="405" y="491" font-size="11" fill="#4A4A4A">Action: Create onboarding tasks</text>
  
  <!-- Use Case 3 -->
  <rect x="80" y="520" width="280" height="90" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="5"/>
  <text x="220" y="542" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Follow-Up Reminders</text>
  <line x1="90" y1="552" x2="350" y2="552" stroke="#FF9A3C" stroke-width="1"/>
  <text x="95" y="570" font-size="11" fill="#4A4A4A">Trigger: Task due date approaching</text>
  <text x="95" y="587" font-size="11" fill="#4A4A4A">Action: Send reminder email</text>
  <text x="95" y="604" font-size="11" fill="#4A4A4A">Action: Create mobile notification</text>
  
  <!-- Use Case 4 -->
  <rect x="390" y="520" width="280" height="90" fill="#FFFFFF" stroke="#FF9A3C" stroke-width="2" rx="5"/>
  <text x="530" y="542" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Data Quality Enforcement</text>
  <line x1="400" y1="552" x2="660" y2="552" stroke="#FF9A3C" stroke-width="1"/>
  <text x="405" y="570" font-size="11" fill="#4A4A4A">Trigger: Record saved with missing data</text>
  <text x="405" y="587" font-size="11" fill="#4A4A4A">Action: Prevent save, show error</text>
  <text x="405" y="604" font-size="11" fill="#4A4A4A">Action: Send notification to owner</text>
  
  <!-- Right Section: Automation Workflow Example -->
  <rect x="710" y="330" width="640" height="300" fill="#E8F8E8" stroke="#2E844A" stroke-width="3" rx="10"/>
  <text x="1030" y="365" font-size="20" font-weight="bold" text-anchor="middle" fill="#2E844A">
    Sample Workflow: High-Value Opportunity
  </text>
  
  <!-- Step 1 -->
  <rect x="740" y="390" width="280" height="65" fill="#FFFFFF" stroke="#2E844A" stroke-width="2" rx="8"/>
  <text x="880" y="410" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">1. Trigger Event</text>
  <line x1="750" y1="420" x2="1010" y2="420" stroke="#2E844A" stroke-width="1"/>
  <text x="750" y="437" font-size="11" fill="#4A4A4A">Opportunity Amount &gt; $100,000</text>
  <text x="750" y="450" font-size="11" fill="#4A4A4A">AND Stage = "Proposal/Price Quote"</text>
  
  <!-- Arrow down -->
  <path d="M 880 455 L 880 475" stroke="#2E844A" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Step 2 -->
  <rect x="740" y="475" width="280" height="65" fill="#FFFFFF" stroke="#2E844A" stroke-width="2" rx="8"/>
  <text x="880" y="495" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">2. Automated Actions</text>
  <line x1="750" y1="505" x2="1010" y2="505" stroke="#2E844A" stroke-width="1"/>
  <text x="750" y="522" font-size="11" fill="#4A4A4A">✓ Notify VP of Sales via email</text>
  <text x="750" y="535" font-size="11" fill="#4A4A4A">✓ Add VP as opportunity team member</text>
  
  <!-- Arrow down -->
  <path d="M 880 540 L 880 560" stroke="#2E844A" stroke-width="3" fill="none" marker-end="url(#arrowhead-green)"/>
  
  <!-- Step 3 -->
  <rect x="740" y="560" width="280" height="50" fill="#FFFFFF" stroke="#2E844A" stroke-width="2" rx="8"/>
  <text x="880" y="580" font-size="13" font-weight="bold" text-anchor="middle" fill="#1B3B6F">3. Follow-Up Tasks</text>
  <line x1="750" y1="590" x2="1010" y2="590" stroke="#2E844A" stroke-width="1"/>
  <text x="750" y="603" font-size="11" fill="#4A4A4A">✓ Create executive review meeting task</text>
  
  <!-- Parallel Actions -->
  <rect x="1050" y="400" width="270" height="200" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" rx="8"/>
  <text x="1185" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="#8B5CF6">Parallel Actions</text>
  <line x1="1060" y1="435" x2="1310" y2="435" stroke="#8B5CF6" stroke-width="1"/>
  
  <text x="1070" y="455" font-size="11" font-weight="bold" fill="#1B3B6F">Email Alerts:</text>
  <text x="1070" y="472" font-size="10" fill="#4A4A4A">• Sales rep confirmation</text>
  <text x="1070" y="487" font-size="10" fill="#4A4A4A">• VP notification</text>
  <text x="1070" y="502" font-size="10" fill="#4A4A4A">• Sales ops alert</text>
  
  <text x="1070" y="522" font-size="11" font-weight="bold" fill="#1B3B6F">Field Updates:</text>
  <text x="1070" y="539" font-size="10" fill="#4A4A4A">• Priority = "High"</text>
  <text x="1070" y="554" font-size="10" fill="#4A4A4A">• Requires_VP_Review = TRUE</text>
  
  <text x="1070" y="574" font-size="11" font-weight="bold" fill="#1B3B6F">Record Creation:</text>
  <text x="1070" y="591" font-size="10" fill="#4A4A4A">• Task for exec review</text>
  
  <!-- Bottom Section: Best Practices -->
  <rect x="50" y="660" width="1300" height="310" fill="#F0E6FF" stroke="#8B5CF6" stroke-width="3" rx="10"/>
  <text x="700" y="695" font-size="20" font-weight="bold" text-anchor="middle" fill="#8B5CF6">
    Automation Best Practices
  </text>
  
  <!-- Design Principles -->
  <rect x="80" y="720" width="380" height="230" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" rx="5"/>
  <text x="270" y="745" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Design Principles</text>
  <line x1="90" y1="755" x2="450" y2="755" stroke="#8B5CF6" stroke-width="1"/>
  <text x="95" y="775" font-size="12" fill="#4A4A4A">✓ Start Simple, Then Iterate</text>
  <text x="105" y="793" font-size="10" fill="#666">Begin with basic workflows, add complexity</text>
  <text x="95" y="815" font-size="12" fill="#4A4A4A">✓ Document All Automation Logic</text>
  <text x="105" y="833" font-size="10" fill="#666">Maintain clear documentation for support</text>
  <text x="95" y="855" font-size="12" fill="#4A4A4A">✓ Test in Sandbox First</text>
  <text x="105" y="873" font-size="10" fill="#666">Never deploy directly to production</text>
  <text x="95" y="895" font-size="12" fill="#4A4A4A">✓ Consider User Experience</text>
  <text x="105" y="913" font-size="10" fill="#666">Balance automation with user control</text>
  <text x="95" y="935" font-size="12" fill="#4A4A4A">✓ Monitor and Optimize</text>
  <text x="105" y="953" font-size="10" fill="#666">Track performance and adjust as needed</text>
  
  <!-- Performance -->
  <rect x="490" y="720" width="390" height="230" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2" rx="5"/>
  <text x="685" y="745" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Performance Optimization</text>
  <line x1="500" y1="755" x2="870" y2="755" stroke="#8B5CF6" stroke-width="1"/>
  <text x="505" y="775" font-size="12" fill="#4A4A4A">✓ Bulkify Your Logic</text>
  <text x="515" y="793" font-size="10" fill="#666">Handle collections, not single records</text>
  <text x="505" y="815" font-size="12" fill="#4A4A4A">✓ Avoid Recursive Triggers</text>
  <text x="515" y="833" font-size="10" fill="#666">Implement trigger frameworks to prevent loops</text>
  <text x="505" y="855" font-size="12" fill="#4A4A4A">✓ Minimize SOQL/DML Operations</text>
  <text x="515" y="873" font-size="10" fill="#666">Stay under governor limits (100 SOQL, 150 DML)</text>
  <text x="505" y="895" font-size="12" fill="#4A4A4A">✓ Use Scheduled Actions Wisely</text>
  <text x="515" y="913" font-size="10" fill="#666">Schedule time-dependent actions appropriately</text>
  <text x="505" y="935" font-size="12" fill="#4A4A4A">✓ Deactivate Unused Automation</text>
  <text x="515" y="953" font-size="10" fill="#666">Remove old workflows to improve performance</text>
  
  <!-- Migration -->
  <rect x="910" y="720" width="410" height="230" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="5"/>
  <text x="1115" y="745" font-size="15" font-weight="bold" text-anchor="middle" fill="#1B3B6F">Migration Strategy</text>
  <line x1="920" y1="755" x2="1310" y2="755" stroke="#0176D3" stroke-width="1"/>
  <text x="925" y="775" font-size="12" fill="#4A4A4A">✓ Migrate to Flow Builder</text>
  <text x="935" y="793" font-size="10" fill="#666">Workflow Rules &amp; Process Builder → Flow</text>
  <text x="925" y="815" font-size="12" fill="#4A4A4A">✓ Use Record-Triggered Flows</text>
  <text x="935" y="833" font-size="10" fill="#666">Modern replacement for workflow rules</text>
  <text x="925" y="855" font-size="12" fill="#4A4A4A">✓ Leverage Flow Orchestrator</text>
  <text x="935" y="873" font-size="10" fill="#666">Multi-step business processes with stages</text>
  <text x="925" y="895" font-size="12" fill="#4A4A4A">✓ Plan Gradual Migration</text>
  <text x="935" y="913" font-size="10" fill="#666">Don't rush - test thoroughly before switching</text>
  <text x="925" y="935" font-size="12" fill="#4A4A4A">✓ Maintain Backwards Compatibility</text>
  <text x="935" y="953" font-size="10" fill="#666">Keep critical workflows until flows are proven</text>
  
  <!-- Arrow Definitions -->
  <defs>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2E844A"/>
    </marker>
  </defs>
</svg>
