<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Tableau CRM Architecture
  </text>
  
  <!-- Data Layer -->
  <rect x="50" y="100" width="1100" height="180" rx="10" fill="#e3f2fd" stroke="#0176d3" stroke-width="2"/>
  <text x="100" y="135" font-size="20" font-weight="bold" fill="#0176d3">
    Data Layer
  </text>
  
  <!-- Data Sources -->
  <rect x="100" y="160" width="200" height="90" rx="8" fill="white" stroke="#0176d3" stroke-width="2"/>
  <text x="200" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Data Sources
  </text>
  <text x="110" y="210" font-size="11" fill="#1a1a1a">• Salesforce Objects</text>
  <text x="110" y="228" font-size="11" fill="#1a1a1a">• External Databases</text>
  <text x="110" y="246" font-size="11" fill="#1a1a1a">• CSV Files</text>
  
  <!-- Datasets -->
  <rect x="350" y="160" width="200" height="90" rx="8" fill="white" stroke="#0176d3" stroke-width="2"/>
  <text x="450" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Datasets
  </text>
  <text x="360" y="210" font-size="11" fill="#1a1a1a">• Data Transformation</text>
  <text x="360" y="228" font-size="11" fill="#1a1a1a">• Recipe-Based Prep</text>
  <text x="360" y="246" font-size="11" fill="#1a1a1a">• Optimized Storage</text>
  
  <!-- Data Sync -->
  <rect x="600" y="160" width="200" height="90" rx="8" fill="white" stroke="#0176d3" stroke-width="2"/>
  <text x="700" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Data Sync
  </text>
  <text x="610" y="210" font-size="11" fill="#1a1a1a">• Automated Refresh</text>
  <text x="610" y="228" font-size="11" fill="#1a1a1a">• Incremental Updates</text>
  <text x="610" y="246" font-size="11" fill="#1a1a1a">• Real-Time Streaming</text>
  
  <!-- SAQL Engine -->
  <rect x="850" y="160" width="200" height="90" rx="8" fill="white" stroke="#0176d3" stroke-width="2"/>
  <text x="950" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    SAQL Engine
  </text>
  <text x="860" y="210" font-size="11" fill="#1a1a1a">• Query Processing</text>
  <text x="860" y="228" font-size="11" fill="#1a1a1a">• Aggregations</text>
  <text x="860" y="246" font-size="11" fill="#1a1a1a">• Complex Joins</text>
  
  <!-- Arrows from Data Layer -->
  <path d="M 300 205 L 350 205" stroke="#0176d3" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 550 205 L 600 205" stroke="#0176d3" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  <path d="M 800 205 L 850 205" stroke="#0176d3" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  
  <!-- Analysis Layer -->
  <rect x="50" y="320" width="1100" height="200" rx="10" fill="#fff3e0" stroke="#e97627" stroke-width="2"/>
  <text x="100" y="355" font-size="20" font-weight="bold" fill="#e97627">
    Analysis Layer
  </text>
  
  <!-- Lenses -->
  <rect x="150" y="380" width="220" height="110" rx="8" fill="white" stroke="#e97627" stroke-width="2"/>
  <text x="260" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Lenses
  </text>
  <text x="160" y="435" font-size="11" fill="#1a1a1a">• Ad-Hoc Analysis</text>
  <text x="160" y="453" font-size="11" fill="#1a1a1a">• Quick Visualizations</text>
  <text x="160" y="471" font-size="11" fill="#1a1a1a">• Save as Dashboard</text>
  
  <!-- Einstein Discovery -->
  <rect x="430" y="380" width="220" height="110" rx="8" fill="white" stroke="#e97627" stroke-width="2"/>
  <text x="540" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Einstein Discovery
  </text>
  <text x="440" y="435" font-size="11" fill="#1a1a1a">• Automated Insights</text>
  <text x="440" y="453" font-size="11" fill="#1a1a1a">• Predictive Models</text>
  <text x="440" y="471" font-size="11" fill="#1a1a1a">• What-If Scenarios</text>
  
  <!-- Advanced Analytics -->
  <rect x="710" y="380" width="220" height="110" rx="8" fill="white" stroke="#e97627" stroke-width="2"/>
  <text x="820" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Advanced Analytics
  </text>
  <text x="720" y="435" font-size="11" fill="#1a1a1a">• Statistical Models</text>
  <text x="720" y="453" font-size="11" fill="#1a1a1a">• Time Series</text>
  <text x="720" y="471" font-size="11" fill="#1a1a1a">• Clustering</text>
  
  <!-- Arrows from Data to Analysis -->
  <path d="M 450 280 L 260 380" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 600 280 L 540 380" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 750 280 L 820 380" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  
  <!-- Presentation Layer -->
  <rect x="50" y="560" width="1100" height="200" rx="10" fill="#e8f5e9" stroke="#00d4ff" stroke-width="2"/>
  <text x="100" y="595" font-size="20" font-weight="bold" fill="#00a3bf">
    Presentation Layer
  </text>
  
  <!-- Dashboards -->
  <rect x="100" y="620" width="200" height="110" rx="8" fill="white" stroke="#00d4ff" stroke-width="2"/>
  <text x="200" y="650" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Dashboards
  </text>
  <text x="110" y="675" font-size="11" fill="#1a1a1a">• Interactive Widgets</text>
  <text x="110" y="693" font-size="11" fill="#1a1a1a">• Cross-Filtering</text>
  <text x="110" y="711" font-size="11" fill="#1a1a1a">• Mobile Optimized</text>
  
  <!-- Apps -->
  <rect x="350" y="620" width="200" height="110" rx="8" fill="white" stroke="#00d4ff" stroke-width="2"/>
  <text x="450" y="650" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Apps
  </text>
  <text x="360" y="675" font-size="11" fill="#1a1a1a">• Pre-Built Templates</text>
  <text x="360" y="693" font-size="11" fill="#1a1a1a">• Custom Apps</text>
  <text x="360" y="711" font-size="11" fill="#1a1a1a">• App Exchange</text>
  
  <!-- Embedded Analytics -->
  <rect x="600" y="620" width="200" height="110" rx="8" fill="white" stroke="#00d4ff" stroke-width="2"/>
  <text x="700" y="650" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Embedded
  </text>
  <text x="610" y="675" font-size="11" fill="#1a1a1a">• Lightning Pages</text>
  <text x="610" y="693" font-size="11" fill="#1a1a1a">• Record Context</text>
  <text x="610" y="711" font-size="11" fill="#1a1a1a">• Mobile Integration</text>
  
  <!-- Mobile & API -->
  <rect x="850" y="620" width="200" height="110" rx="8" fill="white" stroke="#00d4ff" stroke-width="2"/>
  <text x="950" y="650" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Distribution
  </text>
  <text x="860" y="675" font-size="11" fill="#1a1a1a">• Mobile Apps</text>
  <text x="860" y="693" font-size="11" fill="#1a1a1a">• Email Subscriptions</text>
  <text x="860" y="711" font-size="11" fill="#1a1a1a">• REST APIs</text>
  
  <!-- Arrows from Analysis to Presentation -->
  <path d="M 260 520 L 200 620" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 540 520 L 450 620" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 700 520 L 700 620" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  <path d="M 820 520 L 950 620" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
  
  <!-- End Users -->
  <rect x="400" y="800" width="400" height="60" rx="8" fill="#032d60" stroke="#001f3f" stroke-width="2"/>
  <text x="600" y="835" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    End Users (Sales, Service, Marketing, Executives)
  </text>
  
  <!-- Arrow to End Users -->
  <path d="M 600 760 L 600 800" stroke="#032d60" stroke-width="3" fill="none" marker-end="url(#arrowdark)"/>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0176d3"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
    <marker id="arrowdark" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#032d60"/>
    </marker>
  </defs>
</svg>