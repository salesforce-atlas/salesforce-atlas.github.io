<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Journey Builder Customer Journey Flow
  </text>
  
  <!-- Entry Sources Section -->
  <text x="120" y="100" font-size="18" font-weight="bold" fill="#0176d3">Entry Sources</text>
  
  <!-- Entry Source 1: API Event -->
  <g>
    <rect x="50" y="120" width="140" height="80" fill="#00a1e0" stroke="#0176d3" stroke-width="2" rx="8"/>
    <text x="120" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">API Event</text>
    <text x="120" y="170" font-size="10" text-anchor="middle" fill="#ffffff">Real-time trigger</text>
    <text x="120" y="185" font-size="10" text-anchor="middle" fill="#ffffff">External system</text>
  </g>
  
  <!-- Entry Source 2: Data Extension -->
  <g>
    <rect x="50" y="220" width="140" height="80" fill="#00a1e0" stroke="#0176d3" stroke-width="2" rx="8"/>
    <text x="120" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Data Extension</text>
    <text x="120" y="270" font-size="10" text-anchor="middle" fill="#ffffff">Scheduled entry</text>
    <text x="120" y="285" font-size="10" text-anchor="middle" fill="#ffffff">Batch processing</text>
  </g>
  
  <!-- Entry Source 3: Salesforce Object -->
  <g>
    <rect x="50" y="320" width="140" height="80" fill="#00a1e0" stroke="#0176d3" stroke-width="2" rx="8"/>
    <text x="120" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Salesforce</text>
    <text x="120" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Object</text>
    <text x="120" y="385" font-size="10" text-anchor="middle" fill="#ffffff">CRM-triggered</text>
  </g>
  
  <!-- Arrows from entry sources to journey start -->
  <path d="M 190 160 L 280 240" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 190 260 L 280 250" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 190 360 L 280 260" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Journey Start -->
  <g>
    <circle cx="320" cy="250" r="50" fill="#2ecc71" stroke="#27ae60" stroke-width="3"/>
    <text x="320" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Journey</text>
    <text x="320" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Entry</text>
  </g>
  
  <!-- Arrow to first email -->
  <line x1="370" y1="250" x2="460" y2="250" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- First Email -->
  <g>
    <rect x="460" y="200" width="150" height="100" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="535" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Welcome Email</text>
    <text x="535" y="255" font-size="11" text-anchor="middle" fill="#ffffff">Subject: Welcome!</text>
    <text x="535" y="275" font-size="11" text-anchor="middle" fill="#ffffff">Content: Intro</text>
    <text x="535" y="290" font-size="10" text-anchor="middle" fill="#ffffff">+ Personalization</text>
  </g>
  
  <!-- Arrow to wait activity -->
  <line x1="610" y1="250" x2="690" y2="250" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Wait Activity 1 -->
  <g>
    <rect x="690" y="215" width="120" height="70" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="8"/>
    <text x="750" y="240" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Wait</text>
    <text x="750" y="260" font-size="11" text-anchor="middle" fill="#ffffff">Duration: 2 days</text>
    <text x="750" y="275" font-size="10" text-anchor="middle" fill="#ffffff">or until opens</text>
  </g>
  
  <!-- Arrow to decision split -->
  <line x1="810" y1="250" x2="900" y2="250" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Decision Split -->
  <g>
    <path d="M 950 150 L 1050 250 L 950 350 L 850 250 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="950" y="240" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Email</text>
    <text x="950" y="260" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Opened?</text>
  </g>
  
  <!-- Yes path label -->
  <text x="990" y="190" font-size="12" font-weight="bold" fill="#27ae60">YES</text>
  
  <!-- Arrow to engaged path -->
  <line x1="1000" y1="180" x2="1100" y2="140" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Engaged Email Path -->
  <g>
    <rect x="1100" y="90" width="140" height="100" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="1170" y="120" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Product</text>
    <text x="1170" y="135" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Showcase Email</text>
    <text x="1170" y="160" font-size="10" text-anchor="middle" fill="#ffffff">Engaged content</text>
    <text x="1170" y="175" font-size="10" text-anchor="middle" fill="#ffffff">+ Recommendations</text>
  </g>
  
  <!-- No path label -->
  <text x="990" y="320" font-size="12" font-weight="bold" fill="#e74c3c">NO</text>
  
  <!-- Arrow to re-engagement path -->
  <line x1="1000" y1="310" x2="1100" y2="360" stroke="#e74c3c" stroke-width="3" marker-end="url(#arrow)"/>
  
  <!-- Re-engagement Email Path -->
  <g>
    <rect x="1100" y="310" width="140" height="100" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="1170" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Re-engagement</text>
    <text x="1170" y="355" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Email</text>
    <text x="1170" y="380" font-size="10" text-anchor="middle" fill="#ffffff">Different subject</text>
    <text x="1170" y="395" font-size="10" text-anchor="middle" fill="#ffffff">Special offer</text>
  </g>
  
  <!-- Wait Activity 2 (Engaged Path) -->
  <g>
    <rect x="1110" y="220" width="120" height="60" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="8"/>
    <text x="1170" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Wait</text>
    <text x="1170" y="265" font-size="10" text-anchor="middle" fill="#ffffff">3 days</text>
  </g>
  
  <!-- Arrow from engaged email to wait -->
  <line x1="1170" y1="190" x2="1170" y2="220" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Wait Activity 3 (Re-engagement Path) -->
  <g>
    <rect x="1110" y="440" width="120" height="60" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="8"/>
    <text x="1170" y="465" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Wait</text>
    <text x="1170" y="480" font-size="10" text-anchor="middle" fill="#ffffff">2 days</text>
  </g>
  
  <!-- Arrow from re-engagement email to wait -->
  <line x1="1170" y1="410" x2="1170" y2="440" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- SMS Activity (Engaged Path) -->
  <g>
    <rect x="1110" y="310" width="120" height="70" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="8"/>
    <text x="1170" y="335" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SMS</text>
    <text x="1170" y="355" font-size="10" text-anchor="middle" fill="#ffffff">Limited offer</text>
    <text x="1170" y="370" font-size="10" text-anchor="middle" fill="#ffffff">24-hour promo</text>
  </g>
  
  <!-- Arrow from wait to SMS -->
  <line x1="1170" y1="280" x2="1170" y2="310" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Decision Split 2 (Re-engagement Path) -->
  <g>
    <path d="M 1170 580 L 1220 630 L 1170 680 L 1120 630 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="1170" y="625" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Engaged?</text>
  </g>
  
  <!-- Arrow from wait to decision -->
  <line x1="1170" y1="500" x2="1170" y2="580" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Exit Journey (No engagement) -->
  <g>
    <circle cx="1300" cy="710" r="40" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <text x="1300" y="710" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Exit</text>
    <text x="1300" y="725" font-size="10" text-anchor="middle" fill="#ffffff">Journey</text>
  </g>
  
  <!-- Arrow to exit -->
  <line x1="1200" y1="660" x2="1270" y2="690" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1230" y="665" font-size="10" fill="#7f8c8d">No</text>
  
  <!-- Final Email (Engaged in re-engagement) -->
  <g>
    <rect x="1110" y="740" width="120" height="80" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="8"/>
    <text x="1170" y="765" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Thank You</text>
    <text x="1170" y="780" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Email</text>
    <text x="1170" y="800" font-size="10" text-anchor="middle" fill="#ffffff">Customer success</text>
  </g>
  
  <!-- Arrow from decision to final email -->
  <line x1="1170" y1="680" x2="1170" y2="740" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1150" y="710" font-size="10" fill="#27ae60">Yes</text>
  
  <!-- Goal Achievement (Engaged Path) -->
  <g>
    <rect x="1110" y="410" width="120" height="70" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="1170" y="435" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Goal: Purchase</text>
    <text x="1170" y="455" font-size="10" text-anchor="middle" fill="#ffffff">Track conversion</text>
    <text x="1170" y="470" font-size="10" text-anchor="middle" fill="#ffffff">Exit journey</text>
  </g>
  
  <!-- Arrow from SMS to Goal -->
  <line x1="1170" y1="380" x2="1170" y2="410" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Goal Achievement (Final) -->
  <g>
    <rect x="1110" y="850" width="120" height="70" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="8"/>
    <text x="1170" y="875" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Journey</text>
    <text x="1170" y="890" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Complete</text>
    <text x="1170" y="910" font-size="10" text-anchor="middle" fill="#ffffff">Success!</text>
  </g>
  
  <!-- Arrow from thank you to completion -->
  <line x1="1170" y1="820" x2="1170" y2="850" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <text x="50" y="550" font-size="16" font-weight="bold" fill="#1a1a1a">Activity Legend:</text>
  
  <g>
    <rect x="50" y="570" width="100" height="50" fill="#9b59b6" stroke="#8e44ad" stroke-width="2" rx="6"/>
    <text x="100" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Email Send</text>
  </g>
  
  <g>
    <rect x="170" y="570" width="100" height="50" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="6"/>
    <text x="220" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">SMS Send</text>
  </g>
  
  <g>
    <rect x="290" y="570" width="100" height="50" fill="#f39c12" stroke="#e67e22" stroke-width="2" rx="6"/>
    <text x="340" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Wait Activity</text>
  </g>
  
  <g>
    <path d="M 450 570 L 490 595 L 450 620 L 410 595 Z" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <text x="450" y="600" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Decision</text>
  </g>
  
  <g>
    <rect x="520" y="570" width="100" height="50" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="6"/>
    <text x="570" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Goal</text>
  </g>
  
  <!-- Key Metrics Box -->
  <rect x="50" y="650" width="570" height="140" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="8"/>
  <text x="335" y="680" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Journey Metrics to Track</text>
  
  <text x="70" y="710" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Entry Rate:</tspan> Number of contacts entering journey</text>
  <text x="70" y="730" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Email Performance:</tspan> Open rates, click rates, bounces</text>
  <text x="70" y="750" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Decision Split Results:</tspan> Path distribution percentages</text>
  <text x="70" y="770" font-size="12" fill="#2c3e50">• <tspan font-weight="bold">Goal Completion:</tspan> Conversion rate and revenue impact</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>