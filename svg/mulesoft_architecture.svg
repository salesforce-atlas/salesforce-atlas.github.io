<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    MuleSoft Anypoint Platform Architecture
  </text>
  
  <!-- Design Center -->
  <g>
    <rect x="50" y="100" width="340" height="200" fill="#4A90E2" stroke="#2E5C8A" stroke-width="2" rx="10"/>
    <text x="220" y="130" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
      Design Center
    </text>
    
    <!-- API Designer -->
    <rect x="70" y="150" width="140" height="60" fill="#6BA3E8" stroke="#4A90E2" stroke-width="2" rx="5"/>
    <text x="140" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      API Designer
    </text>
    <text x="140" y="195" font-size="11" text-anchor="middle" fill="white">
      RAML/OAS Design
    </text>
    
    <!-- Flow Designer -->
    <rect x="230" y="150" width="140" height="60" fill="#6BA3E8" stroke="#4A90E2" stroke-width="2" rx="5"/>
    <text x="300" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Flow Designer
    </text>
    <text x="300" y="195" font-size="11" text-anchor="middle" fill="white">
      Visual Integration
    </text>
    
    <!-- Testing Tools -->
    <rect x="70" y="225" width="140" height="60" fill="#6BA3E8" stroke="#4A90E2" stroke-width="2" rx="5"/>
    <text x="140" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Testing Tools
    </text>
    <text x="140" y="270" font-size="11" text-anchor="middle" fill="white">
      Debug &amp; Mock
    </text>
    
    <!-- Mule Development -->
    <rect x="230" y="225" width="140" height="60" fill="#6BA3E8" stroke="#4A90E2" stroke-width="2" rx="5"/>
    <text x="300" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Development
    </text>
    <text x="300" y="270" font-size="11" text-anchor="middle" fill="white">
      Mule Applications
    </text>
  </g>
  
  <!-- Exchange -->
  <g>
    <rect x="430" y="100" width="340" height="200" fill="#E67E22" stroke="#C0652A" stroke-width="2" rx="10"/>
    <text x="600" y="130" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
      Exchange
    </text>
    
    <!-- API Catalog -->
    <rect x="450" y="150" width="140" height="60" fill="#F39C5E" stroke="#E67E22" stroke-width="2" rx="5"/>
    <text x="520" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      API Catalog
    </text>
    <text x="520" y="195" font-size="11" text-anchor="middle" fill="white">
      Asset Repository
    </text>
    
    <!-- Connectors -->
    <rect x="610" y="150" width="140" height="60" fill="#F39C5E" stroke="#E67E22" stroke-width="2" rx="5"/>
    <text x="680" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Connectors
    </text>
    <text x="680" y="195" font-size="11" text-anchor="middle" fill="white">
      Pre-built Assets
    </text>
    
    <!-- Templates -->
    <rect x="450" y="225" width="140" height="60" fill="#F39C5E" stroke="#E67E22" stroke-width="2" rx="5"/>
    <text x="520" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Templates
    </text>
    <text x="520" y="270" font-size="11" text-anchor="middle" fill="white">
      Reusable Patterns
    </text>
    
    <!-- API Fragments -->
    <rect x="610" y="225" width="140" height="60" fill="#F39C5E" stroke="#E67E22" stroke-width="2" rx="5"/>
    <text x="680" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      API Fragments
    </text>
    <text x="680" y="270" font-size="11" text-anchor="middle" fill="white">
      RAML Components
    </text>
  </g>
  
  <!-- Management Center -->
  <g>
    <rect x="810" y="100" width="340" height="200" fill="#27AE60" stroke="#1E8449" stroke-width="2" rx="10"/>
    <text x="980" y="130" font-size="22" font-weight="bold" text-anchor="middle" fill="white">
      Management Center
    </text>
    
    <!-- Runtime Manager -->
    <rect x="830" y="150" width="140" height="60" fill="#52C77D" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="900" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Runtime Manager
    </text>
    <text x="900" y="195" font-size="11" text-anchor="middle" fill="white">
      Deploy &amp; Monitor
    </text>
    
    <!-- API Manager -->
    <rect x="990" y="150" width="140" height="60" fill="#52C77D" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="1060" y="175" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      API Manager
    </text>
    <text x="1060" y="195" font-size="11" text-anchor="middle" fill="white">
      Policies &amp; Security
    </text>
    
    <!-- Access Management -->
    <rect x="830" y="225" width="140" height="60" fill="#52C77D" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="900" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Access Mgmt
    </text>
    <text x="900" y="270" font-size="11" text-anchor="middle" fill="white">
      Users &amp; Roles
    </text>
    
    <!-- Analytics -->
    <rect x="990" y="225" width="140" height="60" fill="#52C77D" stroke="#27AE60" stroke-width="2" rx="5"/>
    <text x="1060" y="250" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Analytics
    </text>
    <text x="1060" y="270" font-size="11" text-anchor="middle" fill="white">
      Monitoring &amp; Logs
    </text>
  </g>
  
  <!-- Workflow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Design to Exchange Arrow -->
  <path d="M 390 200 L 430 200" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="410" y="190" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Publish</text>
  
  <!-- Exchange to Management Arrow -->
  <path d="M 770 200 L 810 200" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="790" y="190" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">Deploy</text>
  
  <!-- Runtime Environment Layer -->
  <rect x="50" y="350" width="1100" height="180" fill="#F8F9FA" stroke="#CED4DA" stroke-width="2" rx="10"/>
  <text x="600" y="380" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Runtime Environment
  </text>
  
  <!-- CloudHub -->
  <g>
    <rect x="100" y="400" width="200" height="110" fill="#667EEA" stroke="#5A67D8" stroke-width="2" rx="5"/>
    <text x="200" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      CloudHub
    </text>
    <text x="200" y="445" font-size="12" text-anchor="middle" fill="white">
      Cloud Deployment
    </text>
    <circle cx="170" cy="475" r="8" fill="white" opacity="0.8"/>
    <circle cx="200" cy="475" r="8" fill="white" opacity="0.8"/>
    <circle cx="230" cy="475" r="8" fill="white" opacity="0.8"/>
    <text x="200" y="500" font-size="11" text-anchor="middle" fill="white">
      Auto-scaling
    </text>
  </g>
  
  <!-- Hybrid -->
  <g>
    <rect x="340" y="400" width="200" height="110" fill="#9F7AEA" stroke="#805AD5" stroke-width="2" rx="5"/>
    <text x="440" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Hybrid Deployment
    </text>
    <text x="440" y="445" font-size="12" text-anchor="middle" fill="white">
      Cloud + On-Premises
    </text>
    <rect x="380" y="465" width="50" height="35" fill="white" opacity="0.3" stroke="white" stroke-width="1" rx="3"/>
    <text x="405" y="485" font-size="10" text-anchor="middle" fill="white">Cloud</text>
    <rect x="440" y="465" width="50" height="35" fill="white" opacity="0.3" stroke="white" stroke-width="1" rx="3"/>
    <text x="465" y="485" font-size="10" text-anchor="middle" fill="white">On-Prem</text>
  </g>
  
  <!-- Runtime Fabric -->
  <g>
    <rect x="580" y="400" width="200" height="110" fill="#48BB78" stroke="#38A169" stroke-width="2" rx="5"/>
    <text x="680" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      Runtime Fabric
    </text>
    <text x="680" y="445" font-size="12" text-anchor="middle" fill="white">
      Kubernetes-based
    </text>
    <rect x="620" y="465" width="35" height="35" fill="white" opacity="0.3" stroke="white" stroke-width="1" rx="3"/>
    <rect x="665" y="465" width="35" height="35" fill="white" opacity="0.3" stroke="white" stroke-width="1" rx="3"/>
    <rect x="710" y="465" width="35" height="35" fill="white" opacity="0.3" stroke="white" stroke-width="1" rx="3"/>
    <text x="680" y="488" font-size="10" text-anchor="middle" fill="white">Containers</text>
  </g>
  
  <!-- On-Premises -->
  <g>
    <rect x="820" y="400" width="200" height="110" fill="#ED8936" stroke="#DD6B20" stroke-width="2" rx="5"/>
    <text x="920" y="425" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
      On-Premises
    </text>
    <text x="920" y="445" font-size="12" text-anchor="middle" fill="white">
      Standalone Mule
    </text>
    <rect x="870" y="465" width="100" height="35" fill="white" opacity="0.3" stroke="white" stroke-width="1" rx="3"/>
    <text x="920" y="488" font-size="10" text-anchor="middle" fill="white">Data Center</text>
  </g>
  
  <!-- Integration Layer -->
  <rect x="50" y="570" width="1100" height="180" fill="#E9ECEF" stroke="#ADB5BD" stroke-width="2" rx="10"/>
  <text x="600" y="600" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">
    Integration Targets
  </text>
  
  <!-- Salesforce -->
  <g>
    <rect x="100" y="620" width="150" height="110" fill="#00A1E0" stroke="#0070D2" stroke-width="2" rx="5"/>
    <circle cx="175" cy="655" r="20" fill="white"/>
    <text x="175" y="662" font-size="16" font-weight="bold" text-anchor="middle" fill="#00A1E0">SF</text>
    <text x="175" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Salesforce
    </text>
    <text x="175" y="715" font-size="10" text-anchor="middle" fill="white">
      CRM Platform
    </text>
  </g>
  
  <!-- ERP Systems -->
  <g>
    <rect x="290" y="620" width="150" height="110" fill="#0078D4" stroke="#005A9E" stroke-width="2" rx="5"/>
    <rect x="350" y="645" width="30" height="30" fill="white" opacity="0.9" stroke="white" stroke-width="1" rx="3"/>
    <text x="365" y="665" font-size="14" font-weight="bold" text-anchor="middle" fill="#0078D4">ERP</text>
    <text x="365" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      ERP Systems
    </text>
    <text x="365" y="715" font-size="10" text-anchor="middle" fill="white">
      SAP, Oracle, NetSuite
    </text>
  </g>
  
  <!-- Databases -->
  <g>
    <rect x="480" y="620" width="150" height="110" fill="#336791" stroke="#2A5273" stroke-width="2" rx="5"/>
    <rect x="530" y="645" width="50" height="8" fill="white" opacity="0.9" rx="2"/>
    <rect x="530" y="658" width="50" height="8" fill="white" opacity="0.9" rx="2"/>
    <rect x="530" y="671" width="50" height="8" fill="white" opacity="0.9" rx="2"/>
    <text x="555" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Databases
    </text>
    <text x="555" y="715" font-size="10" text-anchor="middle" fill="white">
      SQL, NoSQL, Data Lakes
    </text>
  </g>
  
  <!-- Cloud Services -->
  <g>
    <rect x="670" y="620" width="150" height="110" fill="#FF9900" stroke="#CC7700" stroke-width="2" rx="5"/>
    <circle cx="745" cy="655" r="18" fill="white" opacity="0.9"/>
    <path d="M 735 650 Q 745 645 755 650 Q 760 655 755 660 Q 745 665 735 660 Z" fill="#FF9900"/>
    <text x="745" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Cloud Services
    </text>
    <text x="745" y="715" font-size="10" text-anchor="middle" fill="white">
      AWS, Azure, GCP
    </text>
  </g>
  
  <!-- Legacy Systems -->
  <g>
    <rect x="860" y="620" width="150" height="110" fill="#6C757D" stroke="#495057" stroke-width="2" rx="5"/>
    <rect x="915" y="645" width="40" height="30" fill="white" opacity="0.7" stroke="white" stroke-width="1" rx="2"/>
    <line x1="925" y1="653" x2="945" y2="653" stroke="#6C757D" stroke-width="2"/>
    <line x1="925" y1="660" x2="945" y2="660" stroke="#6C757D" stroke-width="2"/>
    <line x1="925" y1="667" x2="945" y2="667" stroke="#6C757D" stroke-width="2"/>
    <text x="935" y="695" font-size="13" font-weight="bold" text-anchor="middle" fill="white">
      Legacy Systems
    </text>
    <text x="935" y="715" font-size="10" text-anchor="middle" fill="white">
      Mainframe, FTP, SOAP
    </text>
  </g>
  
  <!-- Connection Lines from Runtime to Targets -->
  <line x1="200" y1="510" x2="175" y2="620" stroke="#6C757D" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="440" y1="510" x2="365" y2="620" stroke="#6C757D" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="680" y1="510" x2="555" y2="620" stroke="#6C757D" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="920" y1="510" x2="745" y2="620" stroke="#6C757D" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="920" y1="510" x2="935" y2="620" stroke="#6C757D" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
