<svg viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="700" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Quote-to-Cash Process Flow
  </text>
  
  <!-- Stage 1: Configure -->
  <g id="stage1">
    <rect x="50" y="100" width="220" height="480" fill="#e3f2fd" stroke="#1976d2" stroke-width="3" rx="10"/>
    <text x="160" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#0d47a1">
      1. CONFIGURE
    </text>
    
    <!-- Step 1.1 -->
    <rect x="70" y="160" width="180" height="70" fill="#2196f3" stroke="#0d47a1" stroke-width="2" rx="5"/>
    <text x="160" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Product Selection
    </text>
    <text x="160" y="205" font-size="11" text-anchor="middle" fill="white">
      Select from catalog
    </text>
    <text x="160" y="220" font-size="11" text-anchor="middle" fill="white">
      Guided selling
    </text>
    
    <!-- Step 1.2 -->
    <rect x="70" y="250" width="180" height="70" fill="#2196f3" stroke="#0d47a1" stroke-width="2" rx="5"/>
    <text x="160" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Bundle Configuration
    </text>
    <text x="160" y="295" font-size="11" text-anchor="middle" fill="white">
      Configure options
    </text>
    <text x="160" y="310" font-size="11" text-anchor="middle" fill="white">
      Apply constraints
    </text>
    
    <!-- Step 1.3 -->
    <rect x="70" y="340" width="180" height="70" fill="#2196f3" stroke="#0d47a1" stroke-width="2" rx="5"/>
    <text x="160" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Quantity &amp; Terms
    </text>
    <text x="160" y="385" font-size="11" text-anchor="middle" fill="white">
      Set quantities
    </text>
    <text x="160" y="400" font-size="11" text-anchor="middle" fill="white">
      Define subscription terms
    </text>
    
    <!-- Step 1.4 -->
    <rect x="70" y="430" width="180" height="70" fill="#2196f3" stroke="#0d47a1" stroke-width="2" rx="5"/>
    <text x="160" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Validate Configuration
    </text>
    <text x="160" y="475" font-size="11" text-anchor="middle" fill="white">
      Rules validation
    </text>
    <text x="160" y="490" font-size="11" text-anchor="middle" fill="white">
      Error checking
    </text>
  </g>
  
  <!-- Stage 2: Price -->
  <g id="stage2">
    <rect x="310" y="100" width="220" height="480" fill="#fff3e0" stroke="#f57c00" stroke-width="3" rx="10"/>
    <text x="420" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#e65100">
      2. PRICE
    </text>
    
    <!-- Step 2.1 -->
    <rect x="330" y="160" width="180" height="70" fill="#ff9800" stroke="#e65100" stroke-width="2" rx="5"/>
    <text x="420" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Base Pricing
    </text>
    <text x="420" y="205" font-size="11" text-anchor="middle" fill="white">
      List price lookup
    </text>
    <text x="420" y="220" font-size="11" text-anchor="middle" fill="white">
      Currency conversion
    </text>
    
    <!-- Step 2.2 -->
    <rect x="330" y="250" width="180" height="70" fill="#ff9800" stroke="#e65100" stroke-width="2" rx="5"/>
    <text x="420" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Price Rules
    </text>
    <text x="420" y="295" font-size="11" text-anchor="middle" fill="white">
      Execute price rules
    </text>
    <text x="420" y="310" font-size="11" text-anchor="middle" fill="white">
      Calculate adjustments
    </text>
    
    <!-- Step 2.3 -->
    <rect x="330" y="340" width="180" height="70" fill="#ff9800" stroke="#e65100" stroke-width="2" rx="5"/>
    <text x="420" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Discounting
    </text>
    <text x="420" y="385" font-size="11" text-anchor="middle" fill="white">
      Volume discounts
    </text>
    <text x="420" y="400" font-size="11" text-anchor="middle" fill="white">
      Negotiated pricing
    </text>
    
    <!-- Step 2.4 -->
    <rect x="330" y="430" width="180" height="70" fill="#ff9800" stroke="#e65100" stroke-width="2" rx="5"/>
    <text x="420" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Calculate Totals
    </text>
    <text x="420" y="475" font-size="11" text-anchor="middle" fill="white">
      Subtotals &amp; taxes
    </text>
    <text x="420" y="490" font-size="11" text-anchor="middle" fill="white">
      Grand total
    </text>
  </g>
  
  <!-- Stage 3: Quote -->
  <g id="stage3">
    <rect x="570" y="100" width="220" height="480" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="10"/>
    <text x="680" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#1b5e20">
      3. QUOTE
    </text>
    
    <!-- Step 3.1 -->
    <rect x="590" y="160" width="180" height="70" fill="#4caf50" stroke="#1b5e20" stroke-width="2" rx="5"/>
    <text x="680" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Generate Quote
    </text>
    <text x="680" y="205" font-size="11" text-anchor="middle" fill="white">
      Create quote record
    </text>
    <text x="680" y="220" font-size="11" text-anchor="middle" fill="white">
      Populate line items
    </text>
    
    <!-- Step 3.2 -->
    <rect x="590" y="250" width="180" height="70" fill="#4caf50" stroke="#1b5e20" stroke-width="2" rx="5"/>
    <text x="680" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Generate Document
    </text>
    <text x="680" y="295" font-size="11" text-anchor="middle" fill="white">
      Apply template
    </text>
    <text x="680" y="310" font-size="11" text-anchor="middle" fill="white">
      Format PDF
    </text>
    
    <!-- Step 3.3 -->
    <rect x="590" y="340" width="180" height="70" fill="#4caf50" stroke="#1b5e20" stroke-width="2" rx="5"/>
    <text x="680" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Review &amp; Approval
    </text>
    <text x="680" y="385" font-size="11" text-anchor="middle" fill="white">
      Submit for approval
    </text>
    <text x="680" y="400" font-size="11" text-anchor="middle" fill="white">
      Approval workflow
    </text>
    
    <!-- Step 3.4 -->
    <rect x="590" y="430" width="180" height="70" fill="#4caf50" stroke="#1b5e20" stroke-width="2" rx="5"/>
    <text x="680" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Present to Customer
    </text>
    <text x="680" y="475" font-size="11" text-anchor="middle" fill="white">
      Send quote
    </text>
    <text x="680" y="490" font-size="11" text-anchor="middle" fill="white">
      E-signature
    </text>
  </g>
  
  <!-- Stage 4: Order -->
  <g id="stage4">
    <rect x="830" y="100" width="220" height="480" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="3" rx="10"/>
    <text x="940" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#4a148c">
      4. ORDER
    </text>
    
    <!-- Step 4.1 -->
    <rect x="850" y="160" width="180" height="70" fill="#9c27b0" stroke="#4a148c" stroke-width="2" rx="5"/>
    <text x="940" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Create Order
    </text>
    <text x="940" y="205" font-size="11" text-anchor="middle" fill="white">
      Convert quote
    </text>
    <text x="940" y="220" font-size="11" text-anchor="middle" fill="white">
      Generate order products
    </text>
    
    <!-- Step 4.2 -->
    <rect x="850" y="250" width="180" height="70" fill="#9c27b0" stroke="#4a148c" stroke-width="2" rx="5"/>
    <text x="940" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Create Assets
    </text>
    <text x="940" y="295" font-size="11" text-anchor="middle" fill="white">
      Asset records
    </text>
    <text x="940" y="310" font-size="11" text-anchor="middle" fill="white">
      Subscription records
    </text>
    
    <!-- Step 4.3 -->
    <rect x="850" y="340" width="180" height="70" fill="#9c27b0" stroke="#4a148c" stroke-width="2" rx="5"/>
    <text x="940" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Activate Services
    </text>
    <text x="940" y="385" font-size="11" text-anchor="middle" fill="white">
      Provision services
    </text>
    <text x="940" y="400" font-size="11" text-anchor="middle" fill="white">
      Send notifications
    </text>
    
    <!-- Step 4.4 -->
    <rect x="850" y="430" width="180" height="70" fill="#9c27b0" stroke="#4a148c" stroke-width="2" rx="5"/>
    <text x="940" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Fulfillment
    </text>
    <text x="940" y="475" font-size="11" text-anchor="middle" fill="white">
      Deliver products
    </text>
    <text x="940" y="490" font-size="11" text-anchor="middle" fill="white">
      Update inventory
    </text>
  </g>
  
  <!-- Stage 5: Cash -->
  <g id="stage5">
    <rect x="1090" y="100" width="260" height="480" fill="#fce4ec" stroke="#c2185b" stroke-width="3" rx="10"/>
    <text x="1220" y="130" font-size="18" font-weight="bold" text-anchor="middle" fill="#880e4f">
      5. CASH
    </text>
    
    <!-- Step 5.1 -->
    <rect x="1110" y="160" width="220" height="70" fill="#e91e63" stroke="#880e4f" stroke-width="2" rx="5"/>
    <text x="1220" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Generate Invoice
    </text>
    <text x="1220" y="205" font-size="11" text-anchor="middle" fill="white">
      Create invoice records
    </text>
    <text x="1220" y="220" font-size="11" text-anchor="middle" fill="white">
      Apply billing schedule
    </text>
    
    <!-- Step 5.2 -->
    <rect x="1110" y="250" width="220" height="70" fill="#e91e63" stroke="#880e4f" stroke-width="2" rx="5"/>
    <text x="1220" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Payment Processing
    </text>
    <text x="1220" y="295" font-size="11" text-anchor="middle" fill="white">
      Charge customer
    </text>
    <text x="1220" y="310" font-size="11" text-anchor="middle" fill="white">
      Record payment
    </text>
    
    <!-- Step 5.3 -->
    <rect x="1110" y="340" width="220" height="70" fill="#e91e63" stroke="#880e4f" stroke-width="2" rx="5"/>
    <text x="1220" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Revenue Recognition
    </text>
    <text x="1220" y="385" font-size="11" text-anchor="middle" fill="white">
      Create revenue schedule
    </text>
    <text x="1220" y="400" font-size="11" text-anchor="middle" fill="white">
      Comply with ASC 606
    </text>
    
    <!-- Step 5.4 -->
    <rect x="1110" y="430" width="220" height="70" fill="#e91e63" stroke="#880e4f" stroke-width="2" rx="5"/>
    <text x="1220" y="455" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Renewals &amp; Amendments
    </text>
    <text x="1220" y="475" font-size="11" text-anchor="middle" fill="white">
      Generate renewal quotes
    </text>
    <text x="1220" y="490" font-size="11" text-anchor="middle" fill="white">
      Process amendments
    </text>
  </g>
  
  <!-- Flow Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#424242"/>
    </marker>
  </defs>
  
  <line x1="270" y1="340" x2="310" y2="340" stroke="#424242" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="530" y1="340" x2="570" y2="340" stroke="#424242" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="790" y1="340" x2="830" y2="340" stroke="#424242" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1050" y1="340" x2="1090" y2="340" stroke="#424242" stroke-width="4" marker-end="url(#arrow)"/>
  
  <!-- Cycle arrow back -->
  <path d="M 1220 580 Q 1320 620, 1220 640 Q 700 680, 160 640 Q 60 620, 160 580" 
        stroke="#d32f2f" stroke-width="3" fill="none" stroke-dasharray="8,4" marker-end="url(#arrow)"/>
  <text x="700" y="670" font-size="13" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    Renewal Cycle
  </text>
  
  <!-- Timeline -->
  <rect x="50" y="620" width="1300" height="1" fill="#999"/>
  <text x="700" y="610" font-size="12" text-anchor="middle" fill="#666">
    Typical Timeline: 1-4 weeks
  </text>
</svg>
