<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    API-Led Connectivity - Three-Layer Architecture
  </text>
  
  <!-- System APIs Layer -->
  <g>
    <rect x="50" y="700" width="1300" height="170" fill="#E8F4F8" stroke="#0EA5E9" stroke-width="3" rx="10"/>
    <text x="700" y="735" font-size="24" font-weight="bold" text-anchor="middle" fill="#0EA5E9">
      System APIs
    </text>
    <text x="700" y="760" font-size="14" text-anchor="middle" fill="#555">
      Unlocks data from systems of record - Direct system access
    </text>
    
    <!-- System API boxes -->
    <rect x="100" y="780" width="220" height="70" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" rx="8"/>
    <text x="210" y="808" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Salesforce System API</text>
    <text x="210" y="828" font-size="11" text-anchor="middle" fill="white">GET /accounts/{id}</text>
    <text x="210" y="843" font-size="11" text-anchor="middle" fill="white">POST /opportunities</text>
    
    <rect x="360" y="780" width="220" height="70" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" rx="8"/>
    <text x="470" y="808" font-size="15" font-weight="bold" text-anchor="middle" fill="white">SAP System API</text>
    <text x="470" y="828" font-size="11" text-anchor="middle" fill="white">GET /orders/{id}</text>
    <text x="470" y="843" font-size="11" text-anchor="middle" fill="white">POST /invoices</text>
    
    <rect x="620" y="780" width="220" height="70" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" rx="8"/>
    <text x="730" y="808" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Database System API</text>
    <text x="730" y="828" font-size="11" text-anchor="middle" fill="white">GET /customers/{id}</text>
    <text x="730" y="843" font-size="11" text-anchor="middle" fill="white">UPDATE /inventory</text>
    
    <rect x="880" y="780" width="220" height="70" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" rx="8"/>
    <text x="990" y="808" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Legacy System API</text>
    <text x="990" y="828" font-size="11" text-anchor="middle" fill="white">GET /products/{sku}</text>
    <text x="990" y="843" font-size="11" text-anchor="middle" fill="white">POST /shipments</text>
    
    <rect x="1140" y="780" width="180" height="70" fill="#0EA5E9" stroke="#0284C7" stroke-width="2" rx="8"/>
    <text x="1230" y="808" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Cloud System API</text>
    <text x="1230" y="828" font-size="11" text-anchor="middle" fill="white">GET /analytics</text>
    <text x="1230" y="843" font-size="11" text-anchor="middle" fill="white">POST /events</text>
  </g>
  
  <!-- Process APIs Layer -->
  <g>
    <rect x="150" y="450" width="1100" height="200" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" rx="10"/>
    <text x="700" y="485" font-size="24" font-weight="bold" text-anchor="middle" fill="#D97706">
      Process APIs
    </text>
    <text x="700" y="510" font-size="14" text-anchor="middle" fill="#555">
      Orchestrates business processes and logic - Combines multiple System APIs
    </text>
    
    <!-- Process API boxes -->
    <rect x="200" y="530" width="280" height="100" fill="#F59E0B" stroke="#D97706" stroke-width="2" rx="8"/>
    <text x="340" y="555" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Order Fulfillment Process API</text>
    <text x="340" y="578" font-size="11" text-anchor="middle" fill="white">POST /fulfill-order</text>
    <text x="340" y="596" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Validates order in Salesforce</text>
    <text x="340" y="610" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Creates SAP invoice</text>
    <text x="340" y="624" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Updates inventory</text>
    
    <rect x="520" y="530" width="280" height="100" fill="#F59E0B" stroke="#D97706" stroke-width="2" rx="8"/>
    <text x="660" y="555" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Customer 360 Process API</text>
    <text x="660" y="578" font-size="11" text-anchor="middle" fill="white">GET /customer-360/{id}</text>
    <text x="660" y="596" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Aggregates from Salesforce</text>
    <text x="660" y="610" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Enriches with SAP data</text>
    <text x="660" y="624" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Adds behavioral analytics</text>
    
    <rect x="840" y="530" width="280" height="100" fill="#F59E0B" stroke="#D97706" stroke-width="2" rx="8"/>
    <text x="980" y="555" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Inventory Management Process</text>
    <text x="980" y="578" font-size="11" text-anchor="middle" fill="white">GET /inventory-status</text>
    <text x="980" y="596" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Checks multiple warehouses</text>
    <text x="980" y="610" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Calculates availability</text>
    <text x="980" y="624" font-size="10" text-anchor="middle" fill="white" font-style="italic">• Forecasts replenishment</text>
  </g>
  
  <!-- Experience APIs Layer -->
  <g>
    <rect x="250" y="150" width="900" height="250" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" rx="10"/>
    <text x="700" y="185" font-size="24" font-weight="bold" text-anchor="middle" fill="#2563EB">
      Experience APIs
    </text>
    <text x="700" y="210" font-size="14" text-anchor="middle" fill="#555">
      Provides channel-specific experiences - Optimized for different consumers
    </text>
    
    <!-- Experience API boxes -->
    <rect x="300" y="230" width="200" height="150" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="8"/>
    <circle cx="400" cy="270" r="25" fill="white" opacity="0.9"/>
    <text x="400" y="278" font-size="20" text-anchor="middle" fill="#3B82F6">📱</text>
    <text x="400" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Mobile Experience API</text>
    <text x="400" y="330" font-size="11" text-anchor="middle" fill="white">GET /mobile/dashboard</text>
    <text x="400" y="345" font-size="11" text-anchor="middle" fill="white">GET /mobile/orders</text>
    <text x="400" y="360" font-size="10" text-anchor="middle" fill="white" font-style="italic">Optimized for mobile apps</text>
    <text x="400" y="373" font-size="10" text-anchor="middle" fill="white" font-style="italic">Minimal data transfer</text>
    
    <rect x="540" y="230" width="200" height="150" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="8"/>
    <circle cx="640" cy="270" r="25" fill="white" opacity="0.9"/>
    <text x="640" y="278" font-size="20" text-anchor="middle" fill="#3B82F6">🌐</text>
    <text x="640" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="white">Web Experience API</text>
    <text x="640" y="330" font-size="11" text-anchor="middle" fill="white">GET /web/catalog</text>
    <text x="640" y="345" font-size="11" text-anchor="middle" fill="white">POST /web/checkout</text>
    <text x="640" y="360" font-size="10" text-anchor="middle" fill="white" font-style="italic">Rich web interfaces</text>
    <text x="640" y="373" font-size="10" text-anchor="middle" fill="white" font-style="italic">Desktop optimized</text>
    
    <rect x="780" y="230" width="200" height="150" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="8"/>
    <circle cx="880" cy="270" r="25" fill="white" opacity="0.9"/>
    <text x="880" y="278" font-size="20" text-anchor="middle" fill="#3B82F6">🤖</text>
    <text x="880" y="310" font-size="15" font-weight="bold" text-anchor="middle" fill="white">IoT Experience API</text>
    <text x="880" y="330" font-size="11" text-anchor="middle" fill="white">POST /iot/telemetry</text>
    <text x="880" y="345" font-size="11" text-anchor="middle" fill="white">GET /iot/commands</text>
    <text x="880" y="360" font-size="10" text-anchor="middle" fill="white" font-style="italic">Device communication</text>
    <text x="880" y="373" font-size="10" text-anchor="middle" fill="white" font-style="italic">Lightweight protocols</text>
  </g>
  
  <!-- Backend Systems -->
  <g>
    <!-- Salesforce -->
    <rect x="100" y="140" width="100" height="80" fill="#00A1E0" stroke="#0070D2" stroke-width="2" rx="5"/>
    <circle cx="150" cy="165" r="15" fill="white"/>
    <text x="150" y="171" font-size="12" font-weight="bold" text-anchor="middle" fill="#00A1E0">SF</text>
    <text x="150" y="200" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Salesforce</text>
    
    <!-- SAP -->
    <rect x="100" y="240" width="100" height="80" fill="#0078D4" stroke="#005A9E" stroke-width="2" rx="5"/>
    <text x="150" y="270" font-size="20" font-weight="bold" text-anchor="middle" fill="white">SAP</text>
    <text x="150" y="300" font-size="11" text-anchor="middle" fill="white">ERP System</text>
    
    <!-- Database -->
    <rect x="100" y="340" width="100" height="80" fill="#336791" stroke="#2A5273" stroke-width="2" rx="5"/>
    <rect x="135" y="365" width="30" height="5" fill="white" rx="1"/>
    <rect x="135" y="375" width="30" height="5" fill="white" rx="1"/>
    <rect x="135" y="385" width="30" height="5" fill="white" rx="1"/>
    <text x="150" y="405" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Database</text>
    
    <!-- Legacy -->
    <rect x="100" y="440" width="100" height="80" fill="#6C757D" stroke="#495057" stroke-width="2" rx="5"/>
    <text x="150" y="475" font-size="16" font-weight="bold" text-anchor="middle" fill="white">Legacy</text>
    <text x="150" y="500" font-size="11" text-anchor="middle" fill="white">Mainframe</text>
    
    <!-- Cloud -->
    <rect x="100" y="540" width="100" height="80" fill="#FF9900" stroke="#CC7700" stroke-width="2" rx="5"/>
    <circle cx="150" cy="570" r="12" fill="white" opacity="0.9"/>
    <path d="M 145 567 Q 150 564 155 567 Q 158 570 155 573 Q 150 576 145 573 Z" fill="#FF9900"/>
    <text x="150" y="600" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Cloud Services</text>
  </g>
  
  <!-- Arrows connecting layers -->
  <defs>
    <marker id="arrow-up" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4B5563"/>
    </marker>
  </defs>
  
  <!-- System to Process arrows -->
  <path d="M 340 780 L 340 630" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  <path d="M 660 780 L 660 630" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  <path d="M 980 780 L 980 630" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  
  <!-- Process to Experience arrows -->
  <path d="M 400 530 L 400 400" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  <path d="M 640 530 L 640 400" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  <path d="M 880 530 L 880 400" stroke="#4B5563" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  
  <!-- Backend to System API connections -->
  <path d="M 150 220 L 210 780" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 150 320 L 470 780" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 150 420 L 730 780" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 150 520 L 990 780" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 150 620 L 1230 780" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Benefits Section -->
  <g>
    <rect x="1200" y="150" width="180" height="520" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" rx="8"/>
    <text x="1290" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#1F2937">Key Benefits</text>
    
    <!-- Benefit 1 -->
    <circle cx="1230" cy="210" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="215" font-size="11" font-weight="bold" fill="#1F2937">Reusability</text>
    <text x="1220" y="230" font-size="9" fill="#6B7280">Build once,</text>
    <text x="1220" y="242" font-size="9" fill="#6B7280">use many times</text>
    
    <!-- Benefit 2 -->
    <circle cx="1230" cy="270" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="275" font-size="11" font-weight="bold" fill="#1F2937">Agility</text>
    <text x="1220" y="290" font-size="9" fill="#6B7280">Faster time</text>
    <text x="1220" y="302" font-size="9" fill="#6B7280">to market</text>
    
    <!-- Benefit 3 -->
    <circle cx="1230" cy="330" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="335" font-size="11" font-weight="bold" fill="#1F2937">Loose Coupling</text>
    <text x="1220" y="350" font-size="9" fill="#6B7280">Independent</text>
    <text x="1220" y="362" font-size="9" fill="#6B7280">changes</text>
    
    <!-- Benefit 4 -->
    <circle cx="1230" cy="390" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="395" font-size="11" font-weight="bold" fill="#1F2937">Scalability</text>
    <text x="1220" y="410" font-size="9" fill="#6B7280">Scale each</text>
    <text x="1220" y="422" font-size="9" fill="#6B7280">layer independently</text>
    
    <!-- Benefit 5 -->
    <circle cx="1230" cy="450" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="455" font-size="11" font-weight="bold" fill="#1F2937">Maintainability</text>
    <text x="1220" y="470" font-size="9" fill="#6B7280">Clear separation</text>
    <text x="1220" y="482" font-size="9" fill="#6B7280">of concerns</text>
    
    <!-- Benefit 6 -->
    <circle cx="1230" cy="510" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="515" font-size="11" font-weight="bold" fill="#1F2937">Cost Reduction</text>
    <text x="1220" y="530" font-size="9" fill="#6B7280">Less redundant</text>
    <text x="1220" y="542" font-size="9" fill="#6B7280">development</text>
    
    <!-- Benefit 7 -->
    <circle cx="1230" cy="570" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="575" font-size="11" font-weight="bold" fill="#1F2937">Testability</text>
    <text x="1220" y="590" font-size="9" fill="#6B7280">Independent</text>
    <text x="1220" y="602" font-size="9" fill="#6B7280">layer testing</text>
    
    <!-- Benefit 8 -->
    <circle cx="1230" cy="630" r="12" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <text x="1245" y="635" font-size="11" font-weight="bold" fill="#1F2937">Governance</text>
    <text x="1220" y="650" font-size="9" fill="#6B7280">Centralized</text>
    <text x="1220" y="662" font-size="9" fill="#6B7280">control</text>
  </g>
  
  <!-- Layer Labels on left -->
  <text x="30" y="305" font-size="16" font-weight="bold" fill="#3B82F6" transform="rotate(-90 30 305)">
    EXPERIENCE
  </text>
  <text x="30" y="550" font-size="16" font-weight="bold" fill="#F59E0B" transform="rotate(-90 30 550)">
    PROCESS
  </text>
  <text x="30" y="785" font-size="16" font-weight="bold" fill="#0EA5E9" transform="rotate(-90 30 785)">
    SYSTEM
  </text>
</svg>
