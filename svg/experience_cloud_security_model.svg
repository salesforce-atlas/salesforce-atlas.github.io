<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#032D60">
    Experience Cloud Security &amp; Sharing Model
  </text>
  
  <!-- External Users Section -->
  <rect x="50" y="80" width="500" height="350" fill="#E8F4F8" stroke="#00A1E0" stroke-width="2" rx="8"/>
  <text x="300" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#032D60">
    External Users
  </text>
  
  <!-- User Authentication -->
  <rect x="80" y="130" width="440" height="90" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="300" y="155" font-size="16" font-weight="bold" text-anchor="middle" fill="#032D60">
    Authentication Layer
  </text>
  <text x="110" y="180" font-size="13" text-anchor="start" fill="#54698D">
    • Self-Registration with Email Verification
  </text>
  <text x="110" y="200" font-size="13" text-anchor="start" fill="#54698D">
    • Single Sign-On (SAML 2.0 / OAuth 2.0)
  </text>
  
  <!-- User Profile -->
  <rect x="80" y="240" width="210" height="90" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="185" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Profile &amp; Permissions
  </text>
  <text x="95" y="285" font-size="12" text-anchor="start" fill="#54698D">
    • Object Permissions
  </text>
  <text x="95" y="303" font-size="12" text-anchor="start" fill="#54698D">
    • Field-Level Security
  </text>
  <text x="95" y="321" font-size="12" text-anchor="start" fill="#54698D">
    • Page Access
  </text>
  
  <!-- License Type -->
  <rect x="310" y="240" width="210" height="90" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="415" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    License Type
  </text>
  <text x="325" y="285" font-size="12" text-anchor="start" fill="#54698D">
    • Customer Community
  </text>
  <text x="325" y="303" font-size="12" text-anchor="start" fill="#54698D">
    • Partner Community
  </text>
  <text x="325" y="321" font-size="12" text-anchor="start" fill="#54698D">
    • External Apps
  </text>
  
  <!-- MFA -->
  <rect x="80" y="350" width="440" height="60" fill="#FFE0B2" stroke="#F57C00" stroke-width="2" rx="4"/>
  <text x="300" y="375" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">
    Multi-Factor Authentication (MFA)
  </text>
  <text x="300" y="395" font-size="12" text-anchor="middle" fill="#BF360C">
    Required for sensitive operations and high-security experiences
  </text>
  
  <!-- Sharing Rules Section -->
  <rect x="650" y="80" width="500" height="350" fill="#F4F6F9" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="900" y="110" font-size="20" font-weight="bold" text-anchor="middle" fill="#032D60">
    Sharing Configuration
  </text>
  
  <!-- External OWD -->
  <rect x="680" y="130" width="440" height="80" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="900" y="155" font-size="16" font-weight="bold" text-anchor="middle" fill="#032D60">
    External Organization-Wide Defaults
  </text>
  <text x="695" y="180" font-size="13" text-anchor="start" fill="#54698D">
    • Default access level for all external users
  </text>
  <text x="695" y="200" font-size="13" text-anchor="start" fill="#54698D">
    • Private, Public Read-Only, Public Read/Write
  </text>
  
  <!-- Sharing Sets -->
  <rect x="680" y="230" width="210" height="90" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="785" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Sharing Sets
  </text>
  <text x="695" y="275" font-size="12" text-anchor="start" fill="#54698D">
    • Map user fields to
  </text>
  <text x="700" y="293" font-size="12" text-anchor="start" fill="#54698D">
    record fields
  </text>
  <text x="695" y="311" font-size="12" text-anchor="start" fill="#54698D">
    • Grant automatic access
  </text>
  
  <!-- Sharing Rules -->
  <rect x="910" y="230" width="210" height="90" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="1015" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Sharing Rules
  </text>
  <text x="925" y="275" font-size="12" text-anchor="start" fill="#54698D">
    • Community-specific
  </text>
  <text x="925" y="293" font-size="12" text-anchor="start" fill="#54698D">
    • Criteria-based sharing
  </text>
  <text x="925" y="311" font-size="12" text-anchor="start" fill="#54698D">
    • Ownership-based
  </text>
  
  <!-- Manual Sharing -->
  <rect x="680" y="340" width="440" height="70" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="900" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Manual Record Sharing
  </text>
  <text x="695" y="388" font-size="12" text-anchor="start" fill="#54698D">
    • Grant access to individual records on case-by-case basis
  </text>
  
  <!-- Data Access Flow -->
  <rect x="50" y="460" width="1100" height="180" fill="#E8F4F8" stroke="#00A1E0" stroke-width="2" rx="8"/>
  <text x="600" y="490" font-size="20" font-weight="bold" text-anchor="middle" fill="#032D60">
    Data Access Evaluation Flow
  </text>
  
  <!-- Step 1 -->
  <rect x="100" y="520" width="180" height="90" fill="#FFFFFF" stroke="#00A1E0" stroke-width="2" rx="4"/>
  <text x="190" y="545" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    1. Profile Check
  </text>
  <text x="110" y="565" font-size="11" text-anchor="start" fill="#54698D">
    Does profile have
  </text>
  <text x="110" y="580" font-size="11" text-anchor="start" fill="#54698D">
    object and field
  </text>
  <text x="110" y="595" font-size="11" text-anchor="start" fill="#54698D">
    permissions?
  </text>
  
  <!-- Arrow 1 -->
  <path d="M 280 565 L 320 565" stroke="#00A1E0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 2 -->
  <rect x="320" y="520" width="180" height="90" fill="#FFFFFF" stroke="#00A1E0" stroke-width="2" rx="4"/>
  <text x="410" y="545" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    2. External OWD
  </text>
  <text x="330" y="565" font-size="11" text-anchor="start" fill="#54698D">
    Check default access
  </text>
  <text x="330" y="580" font-size="11" text-anchor="start" fill="#54698D">
    level for external
  </text>
  <text x="330" y="595" font-size="11" text-anchor="start" fill="#54698D">
    users
  </text>
  
  <!-- Arrow 2 -->
  <path d="M 500 565 L 540 565" stroke="#00A1E0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 3 -->
  <rect x="540" y="520" width="180" height="90" fill="#FFFFFF" stroke="#00A1E0" stroke-width="2" rx="4"/>
  <text x="630" y="545" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    3. Sharing Rules
  </text>
  <text x="550" y="565" font-size="11" text-anchor="start" fill="#54698D">
    Apply sharing sets
  </text>
  <text x="550" y="580" font-size="11" text-anchor="start" fill="#54698D">
    and community
  </text>
  <text x="550" y="595" font-size="11" text-anchor="start" fill="#54698D">
    sharing rules
  </text>
  
  <!-- Arrow 3 -->
  <path d="M 720 565 L 760 565" stroke="#00A1E0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Step 4 -->
  <rect x="760" y="520" width="180" height="90" fill="#FFFFFF" stroke="#00A1E0" stroke-width="2" rx="4"/>
  <text x="850" y="545" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    4. Manual Share
  </text>
  <text x="770" y="565" font-size="11" text-anchor="start" fill="#54698D">
    Check for individual
  </text>
  <text x="770" y="580" font-size="11" text-anchor="start" fill="#54698D">
    record access
  </text>
  <text x="770" y="595" font-size="11" text-anchor="start" fill="#54698D">
    grants
  </text>
  
  <!-- Arrow 4 -->
  <path d="M 940 565 L 980 565" stroke="#00A1E0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Final Result -->
  <rect x="980" y="535" width="120" height="60" fill="#C8E6C9" stroke="#388E3C" stroke-width="2" rx="4"/>
  <text x="1040" y="560" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B5E20">
    Access
  </text>
  <text x="1040" y="580" font-size="14" font-weight="bold" text-anchor="middle" fill="#1B5E20">
    Granted
  </text>
  
  <!-- Best Practices Section -->
  <rect x="50" y="670" width="1100" height="190" fill="#F4F6F9" stroke="#0176D3" stroke-width="2" rx="8"/>
  <text x="600" y="700" font-size="20" font-weight="bold" text-anchor="middle" fill="#032D60">
    Security Best Practices
  </text>
  
  <!-- Best Practice 1 -->
  <rect x="100" y="730" width="320" height="100" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="260" y="755" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Least Privilege Access
  </text>
  <text x="115" y="775" font-size="12" text-anchor="start" fill="#54698D">
    • Grant minimum necessary permissions
  </text>
  <text x="115" y="793" font-size="12" text-anchor="start" fill="#54698D">
    • Use specific profiles for external users
  </text>
  <text x="115" y="811" font-size="12" text-anchor="start" fill="#54698D">
    • Regularly audit user access
  </text>
  
  <!-- Best Practice 2 -->
  <rect x="440" y="730" width="320" height="100" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="600" y="755" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Enforce MFA
  </text>
  <text x="455" y="775" font-size="12" text-anchor="start" fill="#54698D">
    • Require MFA for all external users
  </text>
  <text x="455" y="793" font-size="12" text-anchor="start" fill="#54698D">
    • Use session-based security policies
  </text>
  <text x="455" y="811" font-size="12" text-anchor="start" fill="#54698D">
    • Monitor login anomalies
  </text>
  
  <!-- Best Practice 3 -->
  <rect x="780" y="730" width="320" height="100" fill="#FFFFFF" stroke="#0176D3" stroke-width="2" rx="4"/>
  <text x="940" y="755" font-size="14" font-weight="bold" text-anchor="middle" fill="#032D60">
    Monitor &amp; Audit
  </text>
  <text x="795" y="775" font-size="12" text-anchor="start" fill="#54698D">
    • Enable login history tracking
  </text>
  <text x="795" y="793" font-size="12" text-anchor="start" fill="#54698D">
    • Review sharing configurations regularly
  </text>
  <text x="795" y="811" font-size="12" text-anchor="start" fill="#54698D">
    • Use Field Audit Trail for sensitive data
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00A1E0"/>
    </marker>
  </defs>
</svg>
