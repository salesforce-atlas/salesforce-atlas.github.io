<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #032e61; }
      .stage-text { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; }
      .desc-text { font-family: Arial, sans-serif; font-size: 13px; fill: #ffffff; }
      .label-text { font-family: Arial, sans-serif; font-size: 14px; fill: #333333; }
      .arrow { stroke: #0070d2; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .decision-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#0070d2" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c" />
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">Case Management Lifecycle</text>
  
  <!-- Case Creation -->
  <rect x="450" y="80" width="300" height="80" fill="#16325c" rx="10"/>
  <text x="600" y="110" text-anchor="middle" class="stage-text">Case Creation</text>
  <text x="600" y="135" text-anchor="middle" class="desc-text">Email, Web, Phone, Chat,</text>
  <text x="600" y="152" text-anchor="middle" class="desc-text">Social Media, API</text>
  
  <!-- Arrow to Auto-routing -->
  <line x1="600" y1="160" x2="600" y2="200" class="arrow"/>
  
  <!-- Auto-routing -->
  <rect x="450" y="200" width="300" height="80" fill="#0070d2" rx="10"/>
  <text x="600" y="230" text-anchor="middle" class="stage-text">Auto-Routing &amp; Assignment</text>
  <text x="600" y="255" text-anchor="middle" class="desc-text">Skills-based routing</text>
  <text x="600" y="272" text-anchor="middle" class="desc-text">Queue assignment</text>
  
  <!-- Arrow to Case Working -->
  <line x1="600" y1="280" x2="600" y2="320" class="arrow"/>
  
  <!-- Case Working -->
  <rect x="450" y="320" width="300" height="100" fill="#0070d2" rx="10"/>
  <text x="600" y="350" text-anchor="middle" class="stage-text">Case Working</text>
  <text x="600" y="375" text-anchor="middle" class="desc-text">Agent investigation</text>
  <text x="600" y="392" text-anchor="middle" class="desc-text">Customer communication</text>
  <text x="600" y="409" text-anchor="middle" class="desc-text">Knowledge article reference</text>
  
  <!-- Decision Diamond -->
  <polygon points="600,440 700,490 600,540 500,490" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="600" y="490" text-anchor="middle" class="stage-text">Escalate?</text>
  
  <!-- Yes path to Escalation -->
  <line x1="700" y1="490" x2="850" y2="490" class="decision-arrow"/>
  <text x="770" y="480" class="label-text">Yes</text>
  
  <!-- Escalation box -->
  <rect x="850" y="450" width="250" height="80" fill="#e74c3c" rx="10"/>
  <text x="975" y="480" text-anchor="middle" class="stage-text">Escalated</text>
  <text x="975" y="505" text-anchor="middle" class="desc-text">Higher-tier support</text>
  <text x="975" y="522" text-anchor="middle" class="desc-text">Manager involvement</text>
  
  <!-- Escalation back to working -->
  <line x1="975" y1="530" x2="975" y2="600" class="arrow"/>
  <line x1="975" y1="600" x2="600" y2="600" class="arrow"/>
  <line x1="600" y1="600" x2="600" y2="540" class="arrow"/>
  
  <!-- No path to Resolution -->
  <line x1="600" y1="540" x2="600" y2="630" class="arrow"/>
  <text x="620" y="590" class="label-text">No</text>
  
  <!-- Resolution -->
  <rect x="450" y="630" width="300" height="80" fill="#27ae60" rx="10"/>
  <text x="600" y="660" text-anchor="middle" class="stage-text">Resolved</text>
  <text x="600" y="685" text-anchor="middle" class="desc-text">Solution provided</text>
  <text x="600" y="702" text-anchor="middle" class="desc-text">Customer confirmation</text>
  
  <!-- Arrow to Closed -->
  <line x1="600" y1="710" x2="600" y2="750" class="arrow"/>
  
  <!-- Closed -->
  <rect x="450" y="750" width="300" height="80" fill="#16a085" rx="10"/>
  <text x="600" y="780" text-anchor="middle" class="stage-text">Closed</text>
  <text x="600" y="805" text-anchor="middle" class="desc-text">Case archived</text>
  <text x="600" y="822" text-anchor="middle" class="desc-text">Metrics updated</text>
  
  <!-- Side annotations -->
  <rect x="50" y="200" width="280" height="120" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="8"/>
  <text x="190" y="230" text-anchor="middle" class="label-text" font-weight="bold">Key Activities:</text>
  <text x="190" y="255" text-anchor="middle" class="label-text">• SLA tracking starts</text>
  <text x="190" y="277" text-anchor="middle" class="label-text">• Priority assignment</text>
  <text x="190" y="299" text-anchor="middle" class="label-text">• Auto-classification (Einstein)</text>
  
  <rect x="50" y="450" width="280" height="140" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="8"/>
  <text x="190" y="480" text-anchor="middle" class="label-text" font-weight="bold">Decision Criteria:</text>
  <text x="190" y="505" text-anchor="middle" class="label-text">• Case age threshold</text>
  <text x="190" y="527" text-anchor="middle" class="label-text">• Complexity level</text>
  <text x="190" y="549" text-anchor="middle" class="label-text">• SLA breach risk</text>
  <text x="190" y="571" text-anchor="middle" class="label-text">• Customer tier/priority</text>
  
  <!-- Timeline indicator -->
  <text x="100" y="870" class="label-text" font-style="italic">Average Timeline: 2-5 business days (varies by priority)</text>
</svg>