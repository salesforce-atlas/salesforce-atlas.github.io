<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950">
  <!-- Title -->
  <text x="700" y="50" font-size="32" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Security &amp; Governance Framework
  </text>
  
  <!-- Central Security Layer -->
  <g>
    <rect x="500" y="380" width="400" height="180" fill="#EF4444" stroke="#DC2626" stroke-width="4" rx="15"/>
    <text x="700" y="420" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      🔒 Security &amp; Governance
    </text>
    <text x="700" y="450" font-size="14" text-anchor="middle" fill="white">
      Central Control Layer
    </text>
    
    <!-- Key Elements -->
    <rect x="530" y="470" width="160" height="70" fill="#FCA5A5" stroke="#EF4444" stroke-width="2" rx="5"/>
    <text x="610" y="495" font-size="13" font-weight="bold" text-anchor="middle" fill="#7F1D1D">Authentication</text>
    <text x="610" y="512" font-size="10" text-anchor="middle" fill="#7F1D1D">OAuth 2.0 / JWT</text>
    <text x="610" y="527" font-size="10" text-anchor="middle" fill="#7F1D1D">Certificate-based</text>
    
    <rect x="710" y="470" width="160" height="70" fill="#FCA5A5" stroke="#EF4444" stroke-width="2" rx="5"/>
    <text x="790" y="495" font-size="13" font-weight="bold" text-anchor="middle" fill="#7F1D1D">Authorization</text>
    <text x="790" y="512" font-size="10" text-anchor="middle" fill="#7F1D1D">API Policies</text>
    <text x="790" y="527" font-size="10" text-anchor="middle" fill="#7F1D1D">Rate Limiting</text>
  </g>
  
  <!-- Authentication Methods (Top Left) -->
  <g>
    <rect x="50" y="100" width="380" height="240" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" rx="10"/>
    <text x="240" y="135" font-size="20" font-weight="bold" text-anchor="middle" fill="#1E40AF">
      Authentication Methods
    </text>
    
    <!-- OAuth JWT -->
    <rect x="80" y="155" width="160" height="80" fill="#3B82F6" stroke="#2563EB" stroke-width="2" rx="5"/>
    <text x="160" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="white">OAuth 2.0 JWT</text>
    <text x="160" y="197" font-size="10" text-anchor="middle" fill="white">✓ Certificate-based</text>
    <text x="160" y="212" font-size="10" text-anchor="middle" fill="white">✓ Most secure</text>
    <text x="160" y="227" font-size="10" text-anchor="middle" fill="white">✓ Service-to-service</text>
    
    <!-- Username-Password -->
    <rect x="260" y="155" width="150" height="80" fill="#60A5FA" stroke="#3B82F6" stroke-width="2" rx="5"/>
    <text x="335" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Username-Pass</text>
    <text x="335" y="197" font-size="10" text-anchor="middle" fill="white">User credentials</text>
    <text x="335" y="212" font-size="10" text-anchor="middle" fill="white">Security token</text>
    <text x="335" y="227" font-size="10" text-anchor="middle" fill="white">Simple setup</text>
    
    <!-- SAML -->
    <rect x="80" y="250" width="160" height="70" fill="#60A5FA" stroke="#3B82F6" stroke-width="2" rx="5"/>
    <text x="160" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="white">SAML Bearer</text>
    <text x="160" y="292" font-size="10" text-anchor="middle" fill="white">SAML assertion</text>
    <text x="160" y="307" font-size="10" text-anchor="middle" fill="white">Enterprise SSO</text>
    
    <!-- Web Server Flow -->
    <rect x="260" y="250" width="150" height="70" fill="#60A5FA" stroke="#3B82F6" stroke-width="2" rx="5"/>
    <text x="335" y="275" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Web Server</text>
    <text x="335" y="292" font-size="10" text-anchor="middle" fill="white">Browser-based</text>
    <text x="335" y="307" font-size="10" text-anchor="middle" fill="white">OAuth code grant</text>
  </g>
  
  <!-- Data Security (Top Right) -->
  <g>
    <rect x="970" y="100" width="380" height="240" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3" rx="10"/>
    <text x="1160" y="135" font-size="20" font-weight="bold" text-anchor="middle" fill="#92400E">
      Data Security
    </text>
    
    <!-- Encryption in Transit -->
    <rect x="1000" y="155" width="160" height="80" fill="#F59E0B" stroke="#D97706" stroke-width="2" rx="5"/>
    <text x="1080" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Encryption</text>
    <text x="1080" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="white">in Transit</text>
    <text x="1080" y="212" font-size="10" text-anchor="middle" fill="white">TLS 1.2+</text>
    <text x="1080" y="227" font-size="10" text-anchor="middle" fill="white">Strong ciphers</text>
    
    <!-- Encryption at Rest -->
    <rect x="1180" y="155" width="150" height="80" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="1255" y="180" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Encryption</text>
    <text x="1255" y="195" font-size="13" font-weight="bold" text-anchor="middle" fill="white">at Rest</text>
    <text x="1255" y="212" font-size="10" text-anchor="middle" fill="white">Shield Platform</text>
    <text x="1255" y="227" font-size="10" text-anchor="middle" fill="white">Key management</text>
    
    <!-- Field-Level Security -->
    <rect x="1000" y="250" width="160" height="70" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="1080" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Field-Level</text>
    <text x="1080" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Security</text>
    <text x="1080" y="307" font-size="10" text-anchor="middle" fill="white">Permissions &amp; filters</text>
    
    <!-- Data Masking -->
    <rect x="1180" y="250" width="150" height="70" fill="#FBBF24" stroke="#F59E0B" stroke-width="2" rx="5"/>
    <text x="1255" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Data Masking</text>
    <text x="1255" y="292" font-size="10" text-anchor="middle" fill="white">PII protection</text>
    <text x="1255" y="307" font-size="10" text-anchor="middle" fill="white">Test data gen</text>
  </g>
  
  <!-- API Governance (Bottom Left) -->
  <g>
    <rect x="50" y="600" width="380" height="300" fill="#F0FDF4" stroke="#10B981" stroke-width="3" rx="10"/>
    <text x="240" y="635" font-size="20" font-weight="bold" text-anchor="middle" fill="#065F46">
      API Governance
    </text>
    
    <!-- Rate Limiting -->
    <rect x="80" y="655" width="160" height="90" fill="#10B981" stroke="#059669" stroke-width="2" rx="5"/>
    <text x="160" y="680" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Rate Limiting</text>
    <text x="160" y="700" font-size="10" text-anchor="middle" fill="white">• Requests/time period</text>
    <text x="160" y="715" font-size="10" text-anchor="middle" fill="white">• Per client quotas</text>
    <text x="160" y="730" font-size="10" text-anchor="middle" fill="white">• Spike arrest</text>
    
    <!-- API Policies -->
    <rect x="260" y="655" width="150" height="90" fill="#34D399" stroke="#10B981" stroke-width="2" rx="5"/>
    <text x="335" y="680" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Policies</text>
    <text x="335" y="700" font-size="10" text-anchor="middle" fill="white">• Client ID enforce</text>
    <text x="335" y="715" font-size="10" text-anchor="middle" fill="white">• Schema validation</text>
    <text x="335" y="730" font-size="10" text-anchor="middle" fill="white">• CORS config</text>
    
    <!-- SLA Management -->
    <rect x="80" y="760" width="160" height="120" fill="#34D399" stroke="#10B981" stroke-width="2" rx="5"/>
    <text x="160" y="785" font-size="14" font-weight="bold" text-anchor="middle" fill="white">SLA Management</text>
    <text x="160" y="805" font-size="10" text-anchor="middle" fill="white">• Tiered access levels</text>
    <text x="160" y="820" font-size="10" text-anchor="middle" fill="white">• Performance SLAs</text>
    <text x="160" y="835" font-size="10" text-anchor="middle" fill="white">• Monitoring alerts</text>
    <text x="160" y="850" font-size="10" text-anchor="middle" fill="white">• Violation tracking</text>
    <text x="160" y="865" font-size="10" text-anchor="middle" fill="white">• Usage analytics</text>
    
    <!-- Version Control -->
    <rect x="260" y="760" width="150" height="120" fill="#34D399" stroke="#10B981" stroke-width="2" rx="5"/>
    <text x="335" y="785" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Version Control</text>
    <text x="335" y="805" font-size="10" text-anchor="middle" fill="white">• API versioning</text>
    <text x="335" y="820" font-size="10" text-anchor="middle" fill="white">• Backward compat</text>
    <text x="335" y="835" font-size="10" text-anchor="middle" fill="white">• Deprecation policy</text>
    <text x="335" y="850" font-size="10" text-anchor="middle" fill="white">• Migration plans</text>
    <text x="335" y="865" font-size="10" text-anchor="middle" fill="white">• Change tracking</text>
  </g>
  
  <!-- Compliance (Bottom Right) -->
  <g>
    <rect x="970" y="600" width="380" height="300" fill="#FEF2F2" stroke="#EF4444" stroke-width="3" rx="10"/>
    <text x="1160" y="635" font-size="20" font-weight="bold" text-anchor="middle" fill="#991B1B">
      Compliance &amp; Audit
    </text>
    
    <!-- Data Privacy -->
    <rect x="1000" y="655" width="160" height="90" fill="#EF4444" stroke="#DC2626" stroke-width="2" rx="5"/>
    <text x="1080" y="680" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Data Privacy</text>
    <text x="1080" y="700" font-size="10" text-anchor="middle" fill="white">• GDPR compliance</text>
    <text x="1080" y="715" font-size="10" text-anchor="middle" fill="white">• CCPA requirements</text>
    <text x="1080" y="730" font-size="10" text-anchor="middle" fill="white">• Data residency</text>
    
    <!-- Regulatory -->
    <rect x="1180" y="655" width="150" height="90" fill="#F87171" stroke="#EF4444" stroke-width="2" rx="5"/>
    <text x="1255" y="680" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Regulatory</text>
    <text x="1255" y="700" font-size="10" text-anchor="middle" fill="white">• HIPAA</text>
    <text x="1255" y="715" font-size="10" text-anchor="middle" fill="white">• PCI DSS</text>
    <text x="1255" y="730" font-size="10" text-anchor="middle" fill="white">• SOX</text>
    
    <!-- Audit &amp; Logging -->
    <rect x="1000" y="760" width="160" height="120" fill="#F87171" stroke="#EF4444" stroke-width="2" rx="5"/>
    <text x="1080" y="785" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Audit &amp; Logging</text>
    <text x="1080" y="805" font-size="10" text-anchor="middle" fill="white">• Transaction logs</text>
    <text x="1080" y="820" font-size="10" text-anchor="middle" fill="white">• Access logs</text>
    <text x="1080" y="835" font-size="10" text-anchor="middle" fill="white">• Change tracking</text>
    <text x="1080" y="850" font-size="10" text-anchor="middle" fill="white">• Retention policies</text>
    <text x="1080" y="865" font-size="10" text-anchor="middle" fill="white">• Audit reports</text>
    
    <!-- Network Security -->
    <rect x="1180" y="760" width="150" height="120" fill="#F87171" stroke="#EF4444" stroke-width="2" rx="5"/>
    <text x="1255" y="785" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Network Security</text>
    <text x="1255" y="805" font-size="10" text-anchor="middle" fill="white">• IP whitelisting</text>
    <text x="1255" y="820" font-size="10" text-anchor="middle" fill="white">• Firewall rules</text>
    <text x="1255" y="835" font-size="10" text-anchor="middle" fill="white">• VPN tunnels</text>
    <text x="1255" y="850" font-size="10" text-anchor="middle" fill="white">• DDoS protection</text>
    <text x="1255" y="865" font-size="10" text-anchor="middle" fill="white">• WAF policies</text>
  </g>
  
  <!-- Connections to Central Security -->
  <defs>
    <marker id="sec-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>
  
  <!-- Auth to Central -->
  <path d="M 430 240 L 550 430" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#sec-arrow)"/>
  
  <!-- Data Security to Central -->
  <path d="M 970 240 L 850 430" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#sec-arrow)"/>
  
  <!-- Governance to Central -->
  <path d="M 430 700 L 550 530" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#sec-arrow)"/>
  
  <!-- Compliance to Central -->
  <path d="M 970 700 L 850 530" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#sec-arrow)"/>
  
  <!-- Security Layers Label -->
  <g>
    <rect x="500" y="620" width="400" height="60" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" rx="8"/>
    <text x="700" y="643" font-size="13" font-weight="bold" text-anchor="middle" fill="#1F2937">
      Defense in Depth Strategy
    </text>
    <text x="700" y="663" font-size="11" text-anchor="middle" fill="#6B7280">
      Multiple layers of security controls across authentication,
    </text>
    <text x="700" y="678" font-size="11" text-anchor="middle" fill="#6B7280">
      data protection, governance, and compliance
    </text>
  </g>
</svg>
