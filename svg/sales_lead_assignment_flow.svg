<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">
    Lead Assignment Flow - Multi-Source Routing
  </text>
  
  <!-- Lead Source -->
  <rect x="320" y="60" width="160" height="60" rx="8" fill="#0176d3" filter="url(#shadow)"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Incoming Lead</text>
  <text x="400" y="105" text-anchor="middle" font-size="12" fill="white">Multiple Sources</text>
  
  <!-- Arrow down -->
  <line x1="400" y1="120" x2="400" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Lead Assignment Rule -->
  <rect x="280" y="160" width="240" height="60" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="400" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Lead Assignment Rule</text>
  <text x="400" y="205" text-anchor="middle" font-size="12" fill="white">Evaluate Lead Source</text>
  
  <!-- Decision Diamond -->
  <polygon points="400,260 480,310 400,360 320,310" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="400" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Lead Source?</text>
  
  <!-- Branch 1: Website -->
  <line x1="320" y1="310" x2="180" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="60" y="390" width="160" height="80" rx="8" fill="#10b981" filter="url(#shadow)"/>
  <text x="140" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Website Lead</text>
  <text x="140" y="435" text-anchor="middle" font-size="11" fill="white">→ SDR Queue</text>
  <text x="140" y="455" text-anchor="middle" font-size="10" fill="white">Round-Robin</text>
  
  <!-- Arrow to website box -->
  <line x1="180" y1="310" x2="140" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="240" y="305" font-size="11" fill="#333">Website</text>
  
  <!-- Branch 2: Trade Show -->
  <line x1="400" y1="360" x2="400" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="300" y="390" width="200" height="80" rx="8" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Trade Show Lead</text>
  <text x="400" y="435" text-anchor="middle" font-size="11" fill="white">→ Events Queue</text>
  <text x="400" y="455" text-anchor="middle" font-size="10" fill="white">Event Coordinator</text>
  <text x="420" y="380" font-size="11" fill="#333">Trade Show</text>
  
  <!-- Branch 3: Referral -->
  <line x1="480" y1="310" x2="620" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="540" y="390" width="180" height="100" rx="8" fill="#ec4899" filter="url(#shadow)"/>
  <text x="630" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Referral Lead</text>
  <text x="630" y="435" text-anchor="middle" font-size="11" fill="white">Apex Trigger</text>
  <text x="630" y="455" text-anchor="middle" font-size="10" fill="white">→ Referring Rep's</text>
  <text x="630" y="475" text-anchor="middle" font-size="10" fill="white">Manager</text>
  
  <!-- Arrow to referral box -->
  <line x1="620" y1="310" x2="630" y2="390" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="560" y="305" font-size="11" fill="#333">Referral</text>
  
  <!-- Final Assignment -->
  <line x1="140" y1="470" x2="140" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="470" x2="400" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="490" x2="630" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="220" y="530" width="360" height="50" rx="8" fill="#059669" filter="url(#shadow)"/>
  <text x="400" y="555" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Lead Assigned to Owner</text>
  <text x="400" y="572" text-anchor="middle" font-size="11" fill="white">Email Notification Sent</text>
</svg>
