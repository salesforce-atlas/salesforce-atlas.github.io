  <line x1="310" y1="810" x2="580" y2="840" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="810" x2="590" y2="840" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="810" x2="600" y2="825" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="790" y1="810" x2="610" y2="840" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="950" y1="810" x2="620" y2="840" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="1080" y1="810" x2="630" y2="840" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
